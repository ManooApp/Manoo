                <div data-hf-id="hf-eiet" class="e-ch-in"><div data-hf-id="hf-u6op" id="e-in" class="input"><span data-hf-id="hf-jv0d" id="e-in-t">Votre message…</span><span data-hf-id="hf-p8wo" id="e-in-caret" class="caret" style="opacity:0"></span></div><div data-hf-id="hf-ophy" id="e-send" class="e-send"><i data-hf-id="hf-03xw" data-icon="send"></i></div></div>
              </div>
              <div data-hf-id="hf-yeh8" id="e-toast"><div data-hf-id="hf-g8at" class="toast"><i data-hf-id="hf-lqzl" data-icon="circle-check"></i><div data-hf-id="hf-x11t"><div data-hf-id="hf-5t2t" class="toast-t">Abonné</div><div data-hf-id="hf-to68" class="toast-d">Tu suis maintenant cet artisan.</div></div></div></div>
            </div>
          </div>
          <svg data-hf-id="hf-mdx9" id="e-cur" class="cursor" viewBox="0 0 34 40"><path data-hf-id="hf-hpey" d="M3 2 L3 31 L10.5 24.5 L15.5 36 L21 33.6 L16 22.4 L26 22.4 Z" fill="#ffffff" stroke="#0e0a07" stroke-width="2.4" stroke-linejoin="round"/></svg>
          <div data-hf-id="hf-h4i0" id="e-glow"></div>
        </div>
        <div data-hf-id="hf-1udu" id="e-fly"><div data-hf-id="hf-1k5y" class="bubble-out">Bonjour Jules ! Votre portail est superbe. On cherche un apprenti métallier : on en parle ?</div></div>
        </div>
      </div>

      <script>
        (function () {
          const C = window.CUES;
          const T0 = 32.6;
          const retime = window.RETIME || ((t) => t); // authored (Holden) time -> current voice take
          const L = (t) => +(retime(t) - T0).toFixed(3);
          const root = document.getElementById("e-root");
          window.ManooIcons.hydrate(root);
          const $ = (id) => document.getElementById(id);
          const tl = gsap.timeline({ paused: true });
          const br = $("e-br");
          // camera: bring browser point (px,py) to stage (tx,ty) at scale S (origin = browser centre)
          const focus = (px, py, S, tx = 960, ty = 540) => ({ x: tx - 960 - (px - 720) * S, y: ty - 540 - (py - 450) * S, scale: S });
          const cam = (at, v, dur = 0.7, ease = "power3.inOut") => tl.to(br, { ...v, duration: dur, ease }, L(at));
          const cur = $("e-cur");
          const curTo = (at, x, y, dur = 0.42) => tl.to(cur, { x: x - 3, y: y - 2, duration: dur, ease: "power2.inOut" }, L(at));
          const click = (at, el) => {
            tl.to(cur, { scale: 0.86, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut", transformOrigin: "10% 5%" }, L(at));
            if (el) tl.to(el, { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(at));
          };
          const typers = [];
          const classes = [];
          const classAt = (el, cls, at, until = Infinity) => classes.push({ el, cls, t0: L(at), t1: until === Infinity ? Infinity : L(until) });
          const render = () => {
            const t = tl.time();
            for (const c of classes) c.el.classList.toggle(c.cls, t >= c.t0 && t < c.t1);
            $("e-metier-v").textContent = t >= L(35.5) ? "Serrurier / Métallier" : "Métier";
            $("e-metier-v").style.color = t >= L(35.5) ? "#1e1813" : "";
            $("e-url").textContent = t >= L(C.jules2 + 0.02) ? "manoo.fr/profile/jules-moreau" : "manoo.fr/search";
            for (const ty of typers) {
              const k = Math.max(0, Math.min(1, (t - ty.t0) / (ty.t1 - ty.t0)));
              if (t < ty.t0) { ty.el.textContent = ty.ph; ty.el.style.color = "#9a8f86"; }
              else { ty.el.textContent = ty.text.slice(0, Math.round(k * ty.text.length)); ty.el.style.color = "#1e1813"; }
              if (ty.caret) { const on = t >= ty.t0 - 0.15 && t <= ty.t1 + 0.3; ty.caret.style.opacity = on && (t < ty.t1 || Math.floor(t * 4) % 2 === 0) ? "1" : "0"; }
              if (ty.clearAt !== undefined && t >= ty.clearAt) { ty.el.textContent = ty.ph; ty.el.style.color = "#9a8f86"; if (ty.caret) ty.caret.style.opacity = "0"; }
            }
            $("e-follow-t").textContent = t >= L(40.42) ? "Abonné" : "Suivre";
            $("e-followers").textContent = t >= L(40.42) ? "19" : "18";
            $("e-count").textContent = t >= L(C.filtre - 0.02) ? "3 résultats trouvés" : "21 résultats trouvés";
          };

          // ---- initial states
          gsap.set(br, { transformPerspective: 2400, transformOrigin: "50% 50%" });
          gsap.set(["#e-f0", "#e-f1", "#e-f2", "#e-profile"], { opacity: 0 });
          gsap.set("#e-chat", { xPercent: 105 });
          gsap.set(cur, { x: 1000, y: 640, opacity: 0 });

          // ---- whip in
          tl.fromTo(br, { opacity: 0, x: 1500, scale: 0.9, rotationY: -24, rotationX: 4, filter: "blur(22px)" },
            { opacity: 1, x: 0, scale: 0.92, rotationY: -9, rotationX: 4, filter: "blur(0px)", duration: 0.55, ease: "power3.out", immediateRender: true }, L(32.62));
          tl.fromTo("#e-k", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: true }, L(C.entreprise));
          tl.to(br, { rotationY: -6, duration: 1.2, ease: "sine.inOut" }, L(33.2));
          tl.to("#e-k", { opacity: 0, duration: 0.3 }, L(34.2));
          // ---- « un atelier cherche un métallier près de Rennes »
          cam(C.atelier - 0.1, { ...focus(720, 358, 1.38), rotationY: -2, rotationX: 1 }, 0.75);
          tl.to(cur, { opacity: 1, duration: 0.2 }, L(34.6));
          curTo(34.65, 860, 360, 0.42);
          click(35.08, "#e-sel-metier");
          classAt($("e-sel-metier"), "on", 35.1);
          tl.fromTo("#e-dd", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out", immediateRender: true }, L(35.12));
          curTo(35.2, 840, 570, 0.24);
          classAt($("e-dd-opt"), "hl", 35.36);
          click(C.metallier2 + 0.18);
          tl.to("#e-dd", { opacity: 0, duration: 0.12 }, L(35.5));
          
          curTo(35.62, 1110, 362, 0.3);
          click(35.92, "#e-sel-ville");
          classAt($("e-sel-ville"), "on", 35.94);
          typers.push({ el: $("e-ville-v"), text: "Rennes", ph: "Paris, Lyon, Marseille...", t0: L(35.96), t1: L(36.22), caret: $("e-ville-caret") });
          // ---- « il filtre par métier » : results update
          cam(36.45, { ...focus(720, 560, 1.06), rotationY: -4, rotationX: 2 }, 0.7);
          tl.to(cur, { x: 1180, y: 700, duration: 0.5, ease: "power2.inOut" }, L(36.5));
          tl.to(["#e-r0", "#e-r1", "#e-r2"], { opacity: 0, y: 24, scale: 0.96, duration: 0.25, ease: "power2.in", stagger: 0.05 }, L(C.filtre - 0.25));
          ["#e-f0", "#e-f1", "#e-f2"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, y: 40, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.4)", immediateRender: false }, L(C.filtre + 0.05 + i * 0.1));
          });
          // ---- « découvre le portail de Jules » : Jules' card pops out, zoom on the photo
          tl.to(["#e-f1", "#e-f2"], { opacity: 0.45, duration: 0.3 }, L(C.decouvre - 0.05));
          tl.to("#e-f0", { scale: 1.12, y: -18, boxShadow: "0 0 0 3px rgba(249,115,22,0.95), 0 40px 90px rgba(30,24,19,0.35)", zIndex: 5, duration: 0.42, ease: "back.out(1.6)" }, L(C.decouvre - 0.08));
          cam(C.portail2 - 0.25, { ...focus(350, 560, 1.55), rotationY: 0, rotationX: 0 }, 0.6);
          curTo(C.portail2 - 0.1, 380, 610, 0.35);
          click(C.jules2 - 0.12, "#e-f0");
          // ---- profile
          
          tl.to("#e-search", { opacity: 0, x: -60, duration: 0.3, ease: "power2.in" }, L(C.jules2));
          tl.fromTo("#e-profile", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.38, ease: "power3.out", immediateRender: false }, L(C.jules2 + 0.12));
          classAt($("e-nav-search"), "on", 0, C.jules2 + 0.1);
          cam(C.jules2 + 0.1, { ...focus(660, 400, 1.14), rotationY: -3, rotationX: 1 }, 0.6);
          curTo(40.0, 365, 404, 0.3);
          click(40.36, "#e-follow");
          classAt($("e-follow"), "followed", 40.42);
          tl.fromTo("#e-toast", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, L(40.48));
          tl.to("#e-toast", { opacity: 0, y: -16, duration: 0.25 }, L(41.4));
          // ---- « et lui écrit directement »
          curTo(40.62, 690, 404, 0.26);
          click(C.ecrit - 0.02, "#e-msg");
          classAt($("e-nav-msg"), "on", C.ecrit);
          tl.to("#e-chat", { xPercent: 0, duration: 0.4, ease: "power3.out" }, L(C.ecrit + 0.02));
          cam(C.ecrit + 0.05, { ...focus(1210, 520, 1.28), rotationY: -2, rotationX: 0 }, 0.6);
          tl.to(cur, { x: 1300, y: 830, duration: 0.4, ease: "power2.inOut" }, L(41.0));
          typers.push({ el: $("e-in-t"), text: "Bonjour Jules ! Votre portail est superbe. On cherche un apprenti métallier : on en parle ?", ph: "Votre message…", t0: L(41.25), t1: L(41.95), caret: $("e-in-caret"), clearAt: L(42.1) });
          tl.to(cur, { x: 1376, y: 836, duration: 0.2, ease: "power2.inOut" }, L(41.92));
          click(42.06, "#e-send");
          tl.to("#e-empty", { opacity: 0, duration: 0.15 }, L(42.06));
          tl.fromTo("#e-bub", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.7)", immediateRender: false }, L(42.1));
          tl.fromTo("#e-sent", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, L(42.3));
          // ---- hand-off: the message flies to Jules (F6), the browser whips away
          tl.fromTo("#e-fly", { opacity: 0, x: 1150, y: 520, scale: 0.8 }, { opacity: 1, x: 1250, y: 470, scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, L(42.5));
          tl.to("#e-fly", { x: 2100, y: 300, scale: 0.6, filter: "blur(10px)", opacity: 0, duration: 0.4, ease: "power3.in" }, L(42.66));
          tl.to(br, { x: "-=1400", filter: "blur(20px)", opacity: 0, duration: 0.45, ease: "power3.in" }, L(42.6));

          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["entreprise"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
