      <div data-hf-id="hf-f8m3" id="g-root" data-composition-id="signature" data-width="1920" data-height="1080">

        <div data-hf-id="hf-0bdw" id="g-orb"></div>

          <div data-hf-id="hf-2h8c" id="g-ico"><img data-hf-id="hf-2mif" src="assets/brand/manoo-marteau.png" alt=""></div>
          <div data-hf-id="hf-gig9" id="g-word"><span data-hf-id="hf-gv0i" class="l">M</span><span data-hf-id="hf-f9se" class="l">A</span><span data-hf-id="hf-h9bj" class="l">N</span><span data-hf-id="hf-hnmk" class="l">O</span><span data-hf-id="hf-ya50" class="l">O</span><span data-hf-id="hf-5i5r" id="g-dot"></span></div>

          <div data-hf-id="hf-laib" id="g-cta" class="btn">Créer mon compte<i data-hf-id="hf-4lds" data-icon="arrow-right"></i><div data-hf-id="hf-ezg7" id="g-halo"></div></div>
        </div>
        </div>
      </div>

      <script>
        (function () {
          const C = window.CUES;
          const T0 = 47.1;
          const L = (t) => +(t - T0).toFixed(3);
          window.ManooIcons.hydrate(document.getElementById("g-root"));
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#g-rings", { opacity: 0, scale: 0.8, rotation: -15 }, { opacity: 1, scale: 1, rotation: 0, duration: 1.2, ease: "power3.out", immediateRender: true }, L(47.2));
          tl.to("#g-rings", { rotation: 18, duration: 7, ease: "none" }, L(48.4));
          tl.fromTo("#g-orb", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out", immediateRender: true }, L(47.12));
          tl.to("#g-orb", { opacity: 0.0, scale: 1.6, duration: 0.9, ease: "power2.inOut" }, L(48.15));
          tl.fromTo("#g-ico", { opacity: 0, scale: 0.2, rotation: -24 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)", immediateRender: true }, L(C.manoo2 - 0.08));
          tl.fromTo("#g-word .l", { opacity: 0, y: 46, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "back.out(1.7)", stagger: 0.05, immediateRender: true }, L(C.manoo2 + 0.08));
          tl.fromTo("#g-dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(3)", immediateRender: true }, L(C.manoo2 + 0.42));
          tl.to("#g-lock", { y: -70, duration: 0.6, ease: "power3.inOut" }, L(C.revolution - 0.35));
          tl.fromTo("#g-tag .w", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out", stagger: 0.09, immediateRender: true }, L(C.revolution - 0.12));
          tl.to("#g-tag", { y: -70, duration: 0.6, ease: "power3.inOut" }, L(C.rejoignez - 0.45));
          tl.to("#g-lock", { y: -140, duration: 0.6, ease: "power3.inOut" }, L(C.rejoignez - 0.45));
          tl.fromTo(".g-chip", { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: -70, scale: 1, duration: 0.4, ease: "back.out(1.6)", stagger: 0.08, immediateRender: true }, L(C.rejoignez - 0.15));
          tl.fromTo("#g-url", { opacity: 0, scale: 0.7, filter: "blur(12px)" }, { opacity: 1, scale: 1, y: -70, filter: "blur(0px)", duration: 0.42, ease: "back.out(1.8)", immediateRender: true }, L(C.site - 0.45));
          tl.fromTo("#g-cta", { opacity: 0, x: -30, filter: "blur(12px)" }, { opacity: 1, x: 0, y: -70, filter: "blur(0px)", duration: 0.42, ease: "power3.out", immediateRender: true }, L(52.35));
          tl.to("#g-cta", { scale: 0.94, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(53.05));
          tl.fromTo("#g-halo", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 3.2, duration: 0.6, ease: "power2.out", immediateRender: true }, L(53.05));
          tl.fromTo(["#g-lock", "#g-tag", "#g-aud", "#g-row"], { scale: 1 }, { scale: 1.03, duration: 3.0, ease: "none", transformOrigin: "50% 50%", immediateRender: false }, L(52.5));
          // URL typed in the pill, caret blinking (pure function of time)
          const urlT = document.getElementById("g-url-t"), caret = document.getElementById("g-caret");
          const TXT = "manoo.fr";
          const t0 = L(C.site - 0.25), t1 = L(C.site + 0.35);
          const render = () => {
            const t = tl.time();
            const k = Math.max(0, Math.min(1, (t - t0) / (t1 - t0)));
            urlT.textContent = TXT.slice(0, Math.round(k * TXT.length));
            caret.style.opacity = t < t1 || Math.floor((t - t1) * 2.4) % 2 === 0 ? "1" : "0";
          };
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["signature"] = tl;
        })();
      </script>
