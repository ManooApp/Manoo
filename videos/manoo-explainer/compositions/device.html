      <script>
        (function () {
          const C = window.CUES;
          const T0 = 7.6; // host data-start (film time)
          const L = (t) => +(t - T0).toFixed(3);
          const root = document.getElementById("d-root");
          window.ManooIcons.hydrate(root);
          const $ = (id) => document.getElementById(id);
          const tl = gsap.timeline({ paused: true });
          const ph = $("d-ph");

          // ---------- helpers
          const PH = { x: 0, y: 0 }; // phone offset from the stage centre (base: centred)
          function phoneTo(at, v, dur = 0.7, ease = "power3.inOut") {
            tl.to(ph, { ...v, duration: dur, ease }, L(at));
          }
          // stage position of a point given in screen coords, phone straight, centred at (cx, cy), scale s
          const S2 = (px, py, cx = 960, cy = 540, s = 1) => [cx + (18 + px - 215) * s, cy + (18 + py - 444) * s];
          function screenIn(id, at, dur = 0.42) {
            tl.fromTo($(id), { xPercent: 100, opacity: 1 }, { xPercent: 0, opacity: 1, duration: dur, ease: "power3.out", immediateRender: false }, L(at));
          }
          function screenOut(id, at, dur = 0.42) {
            tl.to($(id), { xPercent: -28, opacity: 0.0, duration: dur, ease: "power3.out" }, L(at));
          }
          function tap(at, px, py, big = false) {
            const t = $("d-tap"), f = $("d-finger");
            tl.set([t, f], { x: px, y: py }, L(at) - 0.12);
            tl.fromTo(f, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, L(at) - 0.12);
            tl.to(f, { opacity: 0, scale: 0.8, duration: 0.18, ease: "power2.in" }, L(at) + 0.1);
            tl.fromTo(t, { opacity: 0.95, scale: 0.35 }, { opacity: 0, scale: big ? 2.6 : 1.9, duration: 0.55, ease: "power2.out", immediateRender: false }, L(at));
          }
          function press(el, at) {
            tl.to(el, { scale: 0.94, duration: 0.09, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(at));
          }
          // time-driven class toggles (GSAP 3 cannot set className)
          const classes = [];
          const classAt = (el, cls, at, until = Infinity) => classes.push({ el, cls, t0: L(at), t1: until === Infinity ? Infinity : L(until) });
          // time-driven typing (pure function of the timeline's time)
          const typers = [];
          function typeText(el, text, t0, t1, opts = {}) {
            typers.push({ el, text, t0: L(t0), t1: L(t1), ph: opts.placeholder ?? null, color: opts.color || "#1e1813", caret: opts.caret ? $(opts.caret) : null, after: opts.after });
          }
          // a screen is drawn only while it is on screen (opacity > 0 and not fully slid out)
          const SCREENS = ["d-s-feed", "d-s-profile", "d-s-welcome", "d-s-onb", "d-s-modal"].map((id) => $(id));
          function renderScreens() {
            for (const el of SCREENS) {
              const op = parseFloat(gsap.getProperty(el, "opacity"));
              const xp = Math.abs(parseFloat(gsap.getProperty(el, "xPercent")) || 0);
              el.style.visibility = op > 0.001 && xp < 99.5 ? "visible" : "hidden";
            }
          }
          function renderTypers() {
            const t = tl.time();
            renderScreens();
            for (const c of classes) c.el.classList.toggle(c.cls, t >= c.t0 && t < c.t1);
            for (const ty of typers) {
              const k = Math.max(0, Math.min(1, (t - ty.t0) / (ty.t1 - ty.t0)));
              const n = Math.round(k * ty.text.length);
              if (t < ty.t0 && ty.ph !== null) {
                ty.el.textContent = ty.ph;
                ty.el.style.color = "#9a8f86";
              } else {
                ty.el.textContent = ty.text.slice(0, n);
                ty.el.style.color = ty.color;
              }
              if (ty.caret) {
                const on = t >= ty.t0 - 0.15 && t <= ty.t1 + 0.35;
                ty.caret.style.opacity = on && (t < ty.t1 || Math.floor(t * 4) % 2 === 0) ? "1" : "0";
              }
              if (ty.after) ty.after(t, k);
            }
          }

          // ---------- initial layout of the screens (stacked, all but feed off to the right)
          gsap.set(["#d-s-profile", "#d-s-welcome", "#d-s-onb", "#d-s-modal"], { xPercent: 100 });
          gsap.set("#d-sheet", { yPercent: 105 });
          gsap.set(ph, { transformPerspective: 1800, transformOrigin: "50% 50%" });

          // ================= F2 — emerge from the orb, feed, portfolio (film 9.2 – 14.9)
          tl.fromTo(ph, { opacity: 0, x: 0, y: 220, scale: 0.42, rotationX: 38, rotationY: 0, rotationZ: 0 },
            { opacity: 1, x: 250, y: 18, scale: 1, rotationX: 6, rotationY: -18, rotationZ: 1.5, duration: 0.85, ease: "power3.out", immediateRender: false }, L(C.reseau - 0.05));
          tl.to(ph, { y: -2, rotationY: -14, duration: 2.2, ease: "sine.inOut" }, L(C.reseau + 0.8));
          tl.to("#d-feed-scroll", { y: -150, duration: 1.4, ease: "power2.inOut" }, L(10.2));
          // portfolio
          screenOut("d-s-feed", C.portfolio1 - 0.12);
          screenIn("d-s-profile", C.portfolio1 - 0.12);
          tl.to("#d-pf-scroll", { y: -250, duration: 0.9, ease: "power3.inOut" }, L(C.numerique));
          // tiles pop out on « montrer »
          const tileDst = [[1655, 300], [1665, 745], [600, 850]];
          const tileSrc = [[1150, 560], [1290, 560], [1150, 760]];
          ["d-po-t0", "d-po-t1", "d-po-t2"].forEach((id, i) => {
            const at = L(C.montrer - 0.05 + i * 0.12);
            tl.fromTo($(id), { opacity: 0, x: tileSrc[i][0] - 125, y: tileSrc[i][1] - 125, scale: 0.55, rotation: 0 },
              { opacity: 1, x: tileDst[i][0] - 125, y: tileDst[i][1] - 125, scale: 1, rotation: [-6, 4, -3][i], duration: 0.55, ease: "back.out(1.5)", immediateRender: false }, at);
            tl.to($(id), { y: "-=14", duration: 0.9, ease: "sine.inOut" }, at + 0.55);
            tl.to($(id), { opacity: 0, scale: 0.6, x: 960 - 125, y: 540 - 125, duration: 0.45, ease: "power3.in" }, L(14.35 + i * 0.05));
          });

          // ================= F3 — welcome, profile cards pop out, sign-up (film 14.6 – 22.4)
          phoneTo(14.55, { x: 0, y: 6, rotationX: 0, rotationY: 0, rotationZ: 0, scale: 0.96 }, 0.7);
          screenOut("d-s-profile", 14.65);
          screenIn("d-s-welcome", 14.65);
          tl.to("#d-w-scroll", { y: -330, duration: 0.7, ease: "power3.inOut" }, L(14.95));
          const cueCards = [C.artisans, C.apprentis, C.entreprises, C.ecoles];
          const cardDst = [[420, 300], [420, 760], [1500, 300], [1500, 760]];
          cueCards.forEach((cue, i) => {
            const id = "d-po-c" + i;
            const at = L(cue - 0.08);
            // source: the card's place in the phone (approximate, phone straight)

            tl.fromTo($("d-pc-" + i), { opacity: 1 }, { opacity: 0.25, duration: 0.25, immediateRender: false }, at);
            tl.to($(id), { y: "-=10", duration: 1.2, ease: "sine.inOut" }, at + 0.5);
          });
          tl.to("#d-w-scroll", { y: -560, duration: 0.6, ease: "power3.inOut" }, L(C.entreprises - 0.25));
          tl.to(["#d-po-c0", "#d-po-c1", "#d-po-c2", "#d-po-c3"], { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "power1.inOut", stagger: 0.04 }, L(C.cfa));
          // cards fly back into the phone, sign-up steps
          ["d-po-c0", "d-po-c1", "d-po-c2", "d-po-c3"].forEach((id, i) => {
            tl.to($(id), { opacity: 0, x: 960 - 210, y: 540 - 110, scale: 0.4, duration: 0.42, ease: "power3.in" }, L(C.chacun - 0.35 + i * 0.04));
          });
          screenOut("d-s-welcome", C.chacun - 0.05);
          screenIn("d-s-onb", C.chacun - 0.05);
          tap(C.chacun - 0.25, 197, 470);
          typeText($("d-st1-fn"), "Jules", C.chacun + 0.15, C.chacun + 0.35);
          typeText($("d-st1-ln"), "Moreau", C.chacun + 0.32, C.chacun + 0.55);
          tl.to("#d-st1-av", { background: "linear-gradient(135deg,#fd8b3a,#e4702e)", color: "#fff", duration: 0.2 }, L(C.chacun + 0.1));
          press($("d-onb-btn"), C.cree - 0.12);
          tl.to("#d-st1", { opacity: 0, x: -40, duration: 0.22, ease: "power2.in" }, L(C.cree - 0.02));
          tl.fromTo("#d-st2", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, L(C.cree + 0.08));
          tl.to("#d-step-bar", { width: "66%", duration: 0.3, ease: "power2.out" }, L(C.cree));
          press($("d-onb-btn"), C.profil - 0.14);
          tl.to("#d-st2", { opacity: 0, x: -40, duration: 0.22, ease: "power2.in" }, L(C.profil - 0.04));
          tl.fromTo("#d-st3", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, L(C.profil + 0.06));
          tl.to("#d-step-bar", { width: "100%", duration: 0.3, ease: "power2.out" }, L(C.profil));
          const stepTxt = $("d-step-n");
          typers.push({ el: stepTxt, text: "", t0: 0, t1: 1, after: (t) => { stepTxt.textContent = t < L(C.cree) ? "Étape 1/3" : t < L(C.profil) ? "Étape 2/3" : "Étape 3/3"; } });
          tap(21.2, 197, 770);
          press($("d-onb-btn"), 21.2);
          tl.fromTo("#d-toast-acc", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, L(21.35));

          tl.fromTo("#d-id-c1", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, L(C.apprenti - 0.05));
          tl.fromTo("#d-id-c2", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, L(C.metallier - 0.05));
          // name card shrinks to a badge (top-left) while the footage takes the stage; phone leaves
          tl.to("#d-po-id", { x: -34, y: 34, scale: 0.62, duration: 0.55, ease: "power3.inOut" }, L(24.35));
          phoneTo(24.3, { x: 720, y: 140, scale: 0.8, rotationY: -20, opacity: 0 }, 0.5, "power3.in");
          tl.to("#d-po-id", { opacity: 0, duration: 0.3 }, L(27.0));
          // flash → photo flies into the sheet
          tl.set("#d-sheet", { yPercent: 0 }, L(27.1));
          tl.set("#d-sh-dim", { opacity: 1 }, L(27.1));

          tl.fromTo("#d-po-photo", { opacity: 1, x: 960 - 260, y: 540 - 195, scale: 1.25, rotation: 0 },
            { opacity: 1, x: 1290 - 260, y: 470 - 195, scale: 0.6, rotation: 2, duration: 0.5, ease: "power3.inOut", immediateRender: false }, L(27.12));
          tl.to("#d-po-photo", { opacity: 0, duration: 0.12 }, L(27.6));
          tl.to("#d-drop-img", { opacity: 1, duration: 0.15 }, L(27.58));
          classAt($("d-sh-input"), "focus", 27.72);
          typeText($("d-sh-title"), "Portail en fer forgé", C.ajoute + 0.02, C.ajoute + 0.52, { placeholder: "Ex: Rénovation cuisine chêne massif", caret: "d-sh-caret" });
          tap(28.42, 197, 790);
          press($("d-btn-sheet"), 28.42);
          tl.to("#d-sheet", { yPercent: 105, duration: 0.35, ease: "power3.in" }, L(28.55));
          tl.to("#d-sh-dim", { opacity: 0, duration: 0.3 }, L(28.6));
          tl.set("#d-cell-new", { display: "block" }, L(28.62));
          tl.set("#d-pf-scroll", { y: -250 }, L(28.62));
          tl.fromTo("#d-cell-new", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, L(28.66));
          tl.fromTo("#d-cell-new", { boxShadow: "0 0 0 0px rgba(249,115,22,0)" }, { boxShadow: "0 0 0 4px rgba(249,115,22,0.9)", duration: 0.25, yoyo: true, repeat: 1, immediateRender: false }, L(28.8));
          typers.push({ el: $("d-mcount"), text: "", t0: 0, t1: 1, after: (t) => { $("d-mcount").textContent = t < L(28.66) ? "3 / 5 médias" : "4 / 5 médias"; } });
          tl.fromTo("#d-toast-pf", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, L(C.portfolio2 - 0.05));
          tl.to("#d-toast-pf", { opacity: 0, y: -20, duration: 0.2 }, L(29.2));
          // publish
          tl.set("#d-s-feed", { xPercent: 0, opacity: 1 }, L(28.9));
          tl.set("#d-feed-scroll", { y: 0 }, L(28.9));
          screenOut("d-s-profile", 28.95, 0.3);
          tl.fromTo("#d-s-modal", { xPercent: 0, opacity: 0 }, { xPercent: 0, opacity: 1, duration: 0.2, immediateRender: false }, L(28.98));
          tl.fromTo("#d-modal", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, L(28.98));
          tap(29.18, 104, 214);
          classAt($("d-ty-real"), "on", 29.2);
          typeText($("d-mo-text"), "Portail en fer forgé terminé cette semaine à l’atelier 🔥", 29.24, 29.66, { placeholder: "Partagez votre expérience, un conseil, une question...", caret: "d-mo-caret" });
          typeText($("d-mo-tags"), "métallerie, portail", 29.6, 29.76, { placeholder: "cuisine, rénovation, conseil..." });
          typers.push({ el: $("d-mo-count"), text: "", t0: 0, t1: 1, after: (t) => { const k = Math.max(0, Math.min(1, (t - L(29.24)) / 0.42)); $("d-mo-count").textContent = Math.round(k * 58) + "/1000"; } });
          tap(C.partage + 0.02, 197, 676, true);
          press($("d-btn-publish"), C.partage + 0.02);
          tl.to("#d-s-modal", { opacity: 0, duration: 0.22 }, L(C.partage + 0.16));
          tl.set("#d-new-post", { display: "block" }, L(C.partage + 0.2));
          tl.fromTo("#d-new-post", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, L(C.partage + 0.22));
          tl.to("#d-feed-scroll", { y: -230, duration: 0.45, ease: "power3.inOut" }, L(C.partage + 0.24));
          tl.fromTo("#d-toast-pub", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, L(C.partage + 0.25));
          tl.to("#d-toast-pub", { opacity: 0, y: -20, duration: 0.2 }, L(C.tout + 0.05));
          // the post pops out to the centre; the phone recedes
          tl.fromTo("#d-po-post", { opacity: 0, x: 1290 - 280, y: 560 - 260, scale: 0.62 },
            { opacity: 1, x: 960 - 280, y: 540 - 300, scale: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, L(C.tout - 0.05));
          phoneTo(C.tout - 0.05, { x: 520, y: 60, scale: 0.7, opacity: 0, rotationY: -24 }, 0.55, "power3.in");
          const likes = $("d-pp-likes"), coms = $("d-pp-coms");
          typers.push({ el: likes, text: "", t0: 0, t1: 1, after: (t) => { const k = Math.max(0, Math.min(1, (t - L(C.reseau2)) / 1.4)); likes.textContent = String(Math.round(k * 27)); coms.textContent = String(Math.round(Math.max(0, Math.min(1, (t - L(C.reseau2 + 0.3)) / 1.2)) * 6)); } });
          tl.fromTo("#d-pp-like", { color: "#5d5248" }, { color: "#e11d48", duration: 0.2, immediateRender: false }, L(C.reseau2));
          tl.to("#d-po-post", { y: "-=12", duration: 1.3, ease: "sine.inOut" }, L(C.tout + 0.6));
          tl.to("#d-po-post", { x: -700, opacity: 0, duration: 0.42, ease: "power3.in" }, L(32.55));

          // ================= F6 — notifications on Jules' phone (film 42.9 – 47.4)
          tl.set("#d-s-modal", { opacity: 0 }, L(42.8));
          tl.set("#d-feed-scroll", { y: -230 }, L(42.8));
          tl.set(ph, { x: 320, y: 30, scale: 0.98, rotationX: 4, rotationY: -12, rotationZ: 0 }, L(42.86));
          tl.fromTo(ph, { opacity: 0, x: 900 }, { opacity: 1, x: 320, duration: 0.5, ease: "power3.out", immediateRender: false }, L(42.86));
          tl.fromTo("#d-notif-1", { opacity: 0, y: -60, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)", immediateRender: false }, L(43.15));
          tl.fromTo("#d-po-notif", { opacity: 0, x: 1290 - 330, y: 150 - 80, scale: 0.55 },
            { opacity: 1, x: 1250 - 330, y: 184 - 80, scale: 1, duration: 0.5, ease: "back.out(1.5)", immediateRender: false }, L(43.3));
          // the big card is the in-phone banner lifted out: the banner dissolves into it (inner node, so the
          // entrance tween on #d-notif-1 keeps sole ownership of its own opacity)
          tl.fromTo("#d-notif-1 > .notif", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, L(43.34));
