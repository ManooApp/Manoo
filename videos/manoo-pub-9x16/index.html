<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Manoo — test de style</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
      @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
      @font-face { font-family: "IBM Plex Mono"; src: url(assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); font-weight: 500; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #101619; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #101619; font-family: "Archivo", sans-serif; color: #F3F2EF; }
      .clip { position: absolute; inset: 0; }
      .layer { position: absolute; inset: 0; }

      /* ambient */
      #glow { position: absolute; left: 140px; top: 560px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(closest-side, rgba(249,115,22,.30), rgba(249,115,22,0)); opacity: 0; }
      #vig { background: radial-gradient(120% 85% at 50% 48%, rgba(16,22,25,0) 55%, rgba(6,9,11,.75) 100%); }
      #grain { background: url(assets/matter/grain.png); background-size: 360px 360px; mix-blend-mode: overlay; opacity: .2; }

      /* scene 1 — kinetic type */
      #s1 .words { position: absolute; left: 90px; top: 690px; width: 900px; }
      .ln { display: block; height: 170px; position: relative; white-space: nowrap; font-size: 150px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
      .w { position: relative; display: inline-block; font-weight: 800; font-size: 150px; letter-spacing: -0.045em; line-height: 1; opacity: 0; white-space: nowrap; }
      .w.light { font-weight: 700; color: #78868F; font-size: 88px; margin-top: 40px; }
      .dot { color: #F97316; }
      #sparks { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
      .sp { position: absolute; left: 0; top: 0; width: 4px; height: 26px; border-radius: 2px; background: linear-gradient(180deg, rgba(255,246,232,1), rgba(249,115,22,.9) 55%, rgba(249,115,22,0)); opacity: 0; }

      /* scene 2 — phone in 3D */
      #stage { position: absolute; inset: 0; perspective: 2400px; }
      #phone-rig { position: absolute; left: 260px; top: 360px; width: 560px; height: 1212px; transform-style: preserve-3d; }
      #phone { position: absolute; inset: 0; border-radius: 86px; background: #07090b; box-shadow: 0 0 0 3px #2b363c, inset 0 0 0 6px #12181b, 0 60px 140px rgba(0,0,0,.65); }
      #screen { position: absolute; left: 14px; top: 14px; width: 532px; height: 1184px; border-radius: 72px; overflow: hidden; background: #fbf7f3; }
      #app { position: absolute; left: 0; top: 0; width: 532px; height: 2103px; background: url(assets/app/welcome-full.jpg) top / 100% auto no-repeat; }
      #island { position: absolute; left: 50%; top: 30px; width: 150px; height: 42px; margin-left: -75px; border-radius: 22px; background: #05070a; }
      #pick { position: absolute; left: 22px; top: 433px; width: 488px; height: 306px; border-radius: 26px; box-shadow: 0 0 0 5px #F97316, 0 0 48px rgba(249,115,22,.45); opacity: 0; }
      #touch { position: absolute; left: 226px; top: 546px; width: 80px; height: 80px; border-radius: 50%; background: rgba(249,115,22,.22); border: 4px solid rgba(249,115,22,.85); opacity: 0; }
      #ripple { position: absolute; left: 186px; top: 506px; width: 160px; height: 160px; border-radius: 50%; border: 4px solid rgba(249,115,22,.9); opacity: 0; }
      #s2 .cap { position: absolute; left: 90px; top: 1620px; font-family: "IBM Plex Mono"; font-weight: 500; font-size: 30px; letter-spacing: .14em; text-transform: uppercase; color: #78868F; opacity: 0; }
      #s2 .cap b { color: #F3F2EF; font-weight: 500; }


      .fl { position: absolute; border-radius: 22px; background-size: cover; background-position: center; box-shadow: 0 30px 60px rgba(0,0,0,.55); opacity: 0; }
      .chip { position: absolute; padding: 18px 26px; border-radius: 999px; background: rgba(26,36,42,.92); border: 2px solid #2C383F; font-family: "IBM Plex Mono"; font-weight: 500; font-size: 28px; letter-spacing: .12em; text-transform: uppercase; color: #F3F2EF; white-space: nowrap; opacity: 0; }
      .chip i { font-style: normal; color: #F97316; }
      /* scene 3 — lockup */
      #hammer { position: absolute; left: 400px; top: 640px; width: 280px; height: 316px; background: url(assets/brand/manoo-marteau.png) center / contain no-repeat; opacity: 0; }
      #word { position: absolute; left: 0; width: 1080px; top: 1010px; text-align: center; font-weight: 800; font-size: 190px; letter-spacing: -0.05em; line-height: 1; }
      #word .ch { display: inline-block; opacity: 0; }
      #slogan { position: absolute; left: 0; width: 1080px; top: 1240px; text-align: center; font-weight: 700; font-size: 66px; letter-spacing: -0.025em; opacity: 0; }
      #url { position: absolute; left: 0; width: 1080px; top: 1360px; text-align: center; font-family: "IBM Plex Mono"; font-weight: 500; font-size: 32px; letter-spacing: .14em; text-transform: uppercase; color: #78868F; opacity: 0; }
      #url b { color: #F3F2EF; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="style-test" data-start="0" data-duration="10" data-width="1080" data-height="1920" data-fps="30">

      <div id="glow"></div>

      <section id="s1" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
        <div class="layer" id="s1-cam">
          <div class="words">
            <div class="ln"><span class="w" id="w1">Un</span> <span class="w" id="w2">CV</span></div>
            <div class="ln"><span class="w light" id="w3">ne montre pas</span></div>
            <div class="ln"><span class="w" id="w4">une</span> <span class="w" id="w5">soudure</span><span class="w dot" id="w6">.</span></div>
          </div>
        </div>
        <div id="sparks"></div>
      </section>

      <section id="s2" class="clip" data-start="3.2" data-duration="4.9" data-track-index="2">
        <div id="stage">
          <div class="fl" id="f1" style="left:60px; top:420px; width:230px; height:230px; background-image:url(assets/matter/weld.jpg); background-size:420%; background-position:52% 58%"></div>
          <div class="fl" id="f2" style="left:800px; top:300px; width:210px; height:280px; background-image:url(assets/matter/tiles.jpg); background-size:300%; background-position:20% 20%"></div>
          <div class="fl" id="f3" style="left:780px; top:1150px; width:240px; height:240px; background-image:url(assets/matter/oven.jpg); background-size:330%; background-position:50% 75%"></div>
          <div class="fl" id="f4" style="left:40px; top:1250px; width:200px; height:260px; background-image:url(assets/matter/beam.jpg); background-size:330%; background-position:70% 35%"></div>
          <div id="phone-rig">
            <div id="phone">
              <div id="screen">
                <div id="app"></div>
                <div id="pick"></div>
                <div id="touch"></div>
                <div id="ripple"></div>
              </div>
              <div id="island"></div>
            </div>
          </div>
          <div class="chip" id="c1" style="left:36px; top:790px"><i>●</i> Maçonnerie</div>
          <div class="chip" id="c2" style="left:742px; top:600px"><i>●</i> Soudure</div>
          <div class="chip" id="c3" style="left:618px; top:1452px"><i>●</i> Boulangerie</div>
        </div>
        <div class="cap" id="cap">Profil · <b>Étudiant / Apprenti</b></div>
      </section>

      <section id="s3" class="clip" data-start="7.9" data-duration="2.1" data-track-index="3">
        <div id="hammer"></div>
        <div id="word"><span class="ch">M</span><span class="ch">A</span><span class="ch">N</span><span class="ch">O</span><span class="ch">O</span><span class="ch dot">.</span></div>
        <div id="slogan">La révolution du regard.</div>
        <div id="url">Inscrivez-vous sur <b>manoo.fr</b></div>
      </section>

      <div class="layer" id="vig"></div>
      <div class="layer" id="grain"></div>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var F = 1 / 30;

        // ---------- scene 1: words whip in from below (waterfall-entry), staggered baselines
        var t = 0.25;
        [["#w1", 90, 0.2], ["#w2", 60, 0.17], ["#w3", 50, 0.16], ["#w4", 70, 0.17], ["#w5", 85, 0.2], ["#w6", 60, 0.13]].forEach(function (s, i) {
          tl.set(s[0], { opacity: 1, y: s[1] }, t);
          tl.to(s[0], { y: 0, duration: s[2], ease: "power4.out" }, t);
          t += s[2] + (i === 2 ? 0.22 : i === 4 ? 0.12 : -F);
        });
        var tDot = t; // the period lands -> sparks fly from it

        // sparks: fixed pool, index-seeded ballistic flight driven by one tween (seek-safe)
        var box = document.getElementById("sparks");
        var dr = document.getElementById("w6").getBoundingClientRect(), rr = document.getElementById("root").getBoundingClientRect();
        var N = 34, ox = dr.left - rr.left + dr.width * 0.5, oy = dr.top - rr.top + dr.height * 0.82;
        var parts = [];
        for (var i = 0; i < N; i++) {
          var el = document.createElement("div");
          el.className = "sp";
          box.appendChild(el);
          var h = Math.sin(i * 12.9898 + 78.233) * 43758.5453; h = h - Math.floor(h);
          var h2 = Math.sin(i * 39.3468 + 11.135) * 24634.6345; h2 = h2 - Math.floor(h2);
          var ang = (-160 + 140 * h) * Math.PI / 180;
          var sp = 520 + 900 * h2;
          parts.push({ el: el, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0.55 + 0.6 * h2 });
        }
        var drv = { t: 0 };
        tl.fromTo(drv, { t: 0 }, {
          t: 1.3, duration: 1.3, ease: "none",
          onUpdate: function () {
            var tt = drv.t;
            for (var k = 0; k < N; k++) {
              var p = parts[k];
              var a = Math.min(tt, p.life);
              var x = ox + p.vx * a, y = oy + p.vy * a + 0.5 * 1900 * a * a;
              var vx = p.vx, vy = p.vy + 1900 * a;
              var rot = Math.atan2(vy, vx) * 180 / Math.PI - 90;
              var o = tt <= 0 ? 0 : Math.max(0, 1 - tt / p.life);
              p.el.style.opacity = o;
              p.el.style.transform = "translate(" + x + "px," + y + "px) rotate(" + rot + "deg)";
            }
          }
        }, tDot);
        tl.fromTo("#glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, tDot);

        // camera push-through out of scene 1 (velocity-matched exit)
        tl.fromTo("#s1-cam", { scale: 1, filter: "blur(0px)" }, { scale: 1.35, filter: "blur(18px)", duration: 0.32, ease: "power2.in" }, 3.08);
        tl.fromTo("#s1-cam", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, 3.2);

        // ---------- scene 2: the phone lands in 3D, the real app scrolls, a tap chooses the profile
        tl.fromTo("#phone-rig",
          { y: 260, scale: 0.78, rotationY: -32, rotationX: 18, rotationZ: -6, filter: "blur(16px)" },
          { y: 0, scale: 1, rotationY: -12, rotationX: 6, rotationZ: -2, filter: "blur(0px)", duration: 0.9, ease: "power4.out" }, 3.2);
        tl.to("#phone-rig", { rotationY: 0, rotationX: 0, rotationZ: 0, duration: 1.6, ease: "power2.inOut" }, 4.12);
        tl.fromTo("#app", { y: 0 }, { y: -560, duration: 1.1, ease: "power3.inOut" }, 4.35);
        tl.fromTo("#cap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.4);
        // tap
        tl.fromTo("#touch", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 5.55);
        tl.fromTo("#touch", { scale: 1 }, { scale: 0.8, duration: 0.08, ease: "power1.in", immediateRender: false }, 5.75);
        tl.to("#touch", { scale: 1, opacity: 0, duration: 0.25, ease: "power2.out" }, 5.83);
        tl.fromTo("#ripple", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.8, duration: 0.55, ease: "power2.out" }, 5.8);
        tl.fromTo("#pick", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 5.8);

        // floating réalisations + trade chips: arrive with the phone, drift in parallax, blur = depth
        [["#f1", -120, 40, 6], ["#f2", 140, -60, 3], ["#f3", 160, 80, 8], ["#f4", -150, 90, 4]].forEach(function (f, i) {
          tl.fromTo(f[0], { opacity: 0, x: f[1], y: f[2], scale: 0.7, rotation: (i % 2 ? 8 : -8), filter: "blur(" + (f[3] + 10) + "px)" },
            { opacity: 0.92, x: 0, y: 0, scale: 1, rotation: (i % 2 ? 4 : -4), filter: "blur(" + f[3] + "px)", duration: 0.9, ease: "power4.out" }, 3.35 + i * 0.07);
          tl.to(f[0], { y: (i % 2 ? -40 : 40), rotation: (i % 2 ? 1 : -1), duration: 3.2, ease: "sine.inOut" }, 4.3);
        });
        [["#c1", -60], ["#c2", 60], ["#c3", 50]].forEach(function (c, i) {
          tl.fromTo(c[0], { opacity: 0, x: c[1], scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 3.75 + i * 0.12);
          tl.to(c[0], { y: (i % 2 ? 26 : -26), duration: 3, ease: "sine.inOut" }, 4.4);
        });
        tl.to(".fl, .chip", { opacity: 0, duration: 0.3, ease: "power2.in" }, 7.45);
        // zoom-through into the chosen card
        tl.to("#phone-rig", { scale: 2.6, y: 330, filter: "blur(14px)", duration: 0.45, ease: "power3.in" }, 7.5);
        tl.to("#s2 .cap", { opacity: 0, duration: 0.2 }, 7.5);

        // ---------- scene 3: hammer strikes, MANOO. assembles, slogan
        tl.fromTo("#hammer", { opacity: 0, scale: 0.3, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, 7.95);
        gsap.utils.toArray("#word .ch").forEach(function (c, i) {
          tl.set(c, { opacity: 1, y: 70 }, 8.25 + i * 0.05);
          tl.to(c, { y: 0, duration: 0.18, ease: "power4.out" }, 8.25 + i * 0.05);
        });
        tl.fromTo("#glow", { y: 0 }, { y: 120, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 7.9);
        tl.fromTo("#slogan", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.75);
        tl.fromTo("#url", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 9.05);

        // film grain: stepped offsets, deterministic
        tl.fromTo("#grain", { backgroundPosition: "0px 0px" }, { backgroundPosition: "3600px 2520px", duration: 10, ease: "steps(300)" }, 0);

        window.__timelines["style-test"] = tl;
      })();
    </script>
  </body>
</html>
