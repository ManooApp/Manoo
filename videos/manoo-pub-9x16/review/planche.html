<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face { font-family: "Archivo"; src: url(../assets/fonts/archivo-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: "Archivo"; src: url(../assets/fonts/archivo-latin-800-normal.woff2); font-weight: 800; }
@font-face { font-family: "IBM Plex Mono"; src: url(../assets/fonts/ibm-plex-mono-latin-500-normal.woff2); font-weight: 500; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0b0f11; }
.sheet { width: 2280px; padding: 56px 48px 40px; background:#0b0f11; color:#F3F2EF; font-family: Archivo; }
.sheet h2 { font-weight:800; font-size:44px; letter-spacing:-0.035em; }
.sheet h2 .dot { color:#F97316; }
.sheet .sub { font-family:"IBM Plex Mono"; font-weight:500; font-size:17px; letter-spacing:.14em; text-transform:uppercase; color:#78868F; margin:12px 0 36px; }
.g { display:grid; grid-template-columns: repeat(4, 522px); gap: 34px 32px; }
figure img { width:522px; height:928px; display:block; }
figcaption { padding-top:14px; }
.r { display:flex; justify-content:space-between; font-family:"IBM Plex Mono"; font-weight:500; font-size:17px; letter-spacing:.12em; text-transform:uppercase; }
.r span:last-child { color:#78868F; }
figcaption p { font-weight:500; font-size:21px; line-height:1.35; margin-top:8px; color:#F3F2EF; min-height:58px; }
</style></head><body>
<section class="sheet" id="p1"><h2>Manoo — storyboard v1<span class="dot">.</span> Plans 01a → 04a</h2><div class="sub">Planche fixe · 9:16 · matières dessinées en attendant de vraies photos</div><div class="g"><figure><img src="storyboard-v1/frame-01a.jpg"><figcaption><div class="r"><span>01a · Étincelle</span><span>0,0 s</span></div><p>« Comment montrer un geste… »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-01b.jpg"><figcaption><div class="r"><span>01b · La feuille</span><span>2,2 s</span></div><p>« …sur une feuille de papier ? »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-02.jpg"><figcaption><div class="r"><span>02 · Deux lignes</span><span>4,4 s</span></div><p>« Sur un CV, deux ans d'apprentissage tiennent en deux lignes. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-03a.jpg"><figcaption><div class="r"><span>03a · Le travail est là</span><span>9,0 s</span></div><p>« Pourtant, le travail est là. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-03b.jpg"><figcaption><div class="r"><span>03b · Soudure</span><span>10,8 s</span></div><p>« Une soudure. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-03c.jpg"><figcaption><div class="r"><span>03c · Carrelage</span><span>12,6 s</span></div><p>« Un carrelage posé. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-03d.jpg"><figcaption><div class="r"><span>03d · Boulangerie</span><span>14,4 s</span></div><p>« Un pain qui sort du four. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-04a.jpg"><figcaption><div class="r"><span>04a · Le froissage</span><span>16,4 s</span></div><p>« Manoo remplace le CV papier. »</p></figcaption></figure></div></section>
<section class="sheet" id="p2"><h2>Manoo — storyboard v1<span class="dot">.</span> Plans 04b → 10</h2><div class="sub">Écrans de l'app = emplacements de captures à fournir · profil fictif</div><div class="g"><figure><img src="storyboard-v1/frame-04b.jpg"><figcaption><div class="r"><span>04b · Montrer</span><span>19,0 s</span></div><p>« On ne raconte plus son travail. On le montre. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-05.jpg"><figcaption><div class="r"><span>05 · Le profil</span><span>23,0 s</span></div><p>« L'apprenti crée son profil : son métier, sa formation. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-06.jpg"><figcaption><div class="r"><span>06 · Une photo, un titre</span><span>27,0 s</span></div><p>« Puis, à chaque chantier, chaque pièce, chaque fournée, il ajoute une réalisation. Une photo, un titre. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-07.jpg"><figcaption><div class="r"><span>07 · La galerie</span><span>34,6 s</span></div><p>« Son profil devient la galerie de ce qu'il sait faire. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-08.jpg"><figcaption><div class="r"><span>08 · Le regard</span><span>39,2 s</span></div><p>« Et l'artisan qui recrute voit le geste, la motivation… avant le diplôme. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-09a.jpg"><figcaption><div class="r"><span>09a · L'alternance</span><span>44,8 s</span></div><p>« Manoo est pensé pour l'alternance. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-09b.jpg"><figcaption><div class="r"><span>09b · Savoir-faire</span><span>48,2 s</span></div><p>« Pour ceux qui n'ont pas encore d'expérience à raconter… mais déjà un savoir-faire à montrer. »</p></figcaption></figure>
<figure><img src="storyboard-v1/frame-10.jpg"><figcaption><div class="r"><span>10 · Signature</span><span>54,0 s</span></div><p>« Manoo. La révolution du regard. Inscrivez-vous sur manoo.fr. »</p></figcaption></figure></div></section>
</body></html>
