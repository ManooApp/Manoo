<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/cues.js"></script>
    <script src="assets/ui/icons.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.6" data-width="1080" data-height="1920">
      <!-- the phone: rise, tap, camera, the Manoo pill on the shutter, the island banner; hard cut to white at 6.55 s -->
      <div id="phone" class="clip" data-composition-id="phone" data-composition-src="compositions/phone.html" data-start="0" data-duration="6.55" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- white end: the line word by word, the hammer, the wordmark -->
      <div id="end" class="clip" data-composition-id="end" data-composition-src="compositions/end.html" data-start="6.55" data-duration="6.05" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- light sound effects on the beats (tools/make-sfx.py); the silent cut is the same render without its audio -->
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="12.6" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
