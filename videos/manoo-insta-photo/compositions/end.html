<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/fonts.css">
      <style>
        #e-root { position: absolute; inset: 0; overflow: hidden; background: #fff; }
        /* the line: plain, centred, ink on white, like the reference */
        #e-line { position: absolute; left: 90px; right: 90px; top: 827px; text-align: center; font: 500 80px/1.16 "Inter", sans-serif; letter-spacing: -0.03em; color: #0e1012; transform-origin: 450px 93px; }
        #e-line .w { display: inline-block; opacity: 0; }
        #e-line .w + .w { margin-left: 0.25em; }
        /* the mark, then the lockup [hammer] Manoo — laid out by the script */
        #e-lock { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
        #e-ham { position: absolute; left: 0; top: 0; width: 169px; height: 150px; opacity: 0; }
        #e-word { position: absolute; top: 0; font: 700 150px/1 "Inter Display", sans-serif; letter-spacing: -0.045em; color: #f26d14; white-space: nowrap; clip-path: inset(-30px 100% -30px 0px); }
      </style>

      <div data-hf-id="hf-en00" id="e-root" data-composition-id="end" data-width="1080" data-height="1920">
        <div data-hf-id="hf-en01" id="e-line"><span data-hf-id="hf-en02" class="w">Publie</span><span data-hf-id="hf-en03" class="w">ton</span><span data-hf-id="hf-en04" class="w">chantier</span><br data-hf-id="hf-en05"><span data-hf-id="hf-en06" class="w">en</span><span data-hf-id="hf-en07" class="w">une</span><span data-hf-id="hf-en08" class="w">photo.</span></div>
        <div data-hf-id="hf-en09" id="e-lock" data-layout-allow-overlap>
          <img data-hf-id="hf-en0a" id="e-ham" src="assets/brand/manoo-marteau.png" alt="">
          <div data-hf-id="hf-en0b" id="e-word">Manoo</div>
        </div>
      </div>

      <script>
        (function () {
          const T = window.T;
          const T0 = T.cut;  // this composition starts on the cut to white
          const L = (t) => +(t - T0).toFixed(3);
          const root = document.getElementById("e-root");
          const $ = (s) => root.querySelector(s);

          const tl = gsap.timeline({ paused: true });

          // ---- the line, word by word out of a blur (then all of it blurs away)
          tl.fromTo("#e-line .w", { opacity: 0, filter: "blur(14px)", color: "#a3a7ab", y: 6 },
                    { opacity: 1, filter: "blur(0px)", color: "#0e1012", y: 0, duration: 0.42, ease: "power2.out", stagger: 0.12, immediateRender: true }, L(T.words));
          tl.fromTo("#e-line", { scale: 1 }, { scale: 1.035, duration: L(T.wordsOut + 0.3) - L(T.words), ease: "none", immediateRender: true }, L(T.words));
          tl.to("#e-line .w", { opacity: 0, filter: "blur(16px)", duration: 0.3, ease: "power2.in" }, L(T.wordsOut));

          // ---- the mark fades in, sharpens, then opens into the wordmark
          tl.fromTo("#e-ham", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: true }, L(T.mark));

          // lockup geometry: hammer 169 x 150, gap 34, then the word, optically centred on the hammer
          const HAM_W = 169, HAM_H = 150, GAP = 34, WORD_DY = -6;
          const word = $("#e-word"), lock = $("#e-lock");
          // « Manoo » in Inter Display Bold 150 px, -0.045em: box 445.3 px wide (measured with the font in Chromium);
          // the last « o » inks ~7 px past the box (negative tracking), so the lockup is centred on 452 px
          const WT = 452;
          word.style.width = "446px";
          word.style.left = HAM_W + GAP + "px";
          word.style.top = (HAM_H / 2 - 75 + WORD_DY) + "px";
          const MARK_H = 262;           // the mark alone, centred (1.75 x its size in the lockup)
          const CY = 920;               // vertical centre of the mark / lockup
          const S0 = MARK_H / HAM_H;
          const EXP = 0.44;
          const eExp = gsap.parseEase("power3.inOut");
          const clamp = (v) => Math.min(1, Math.max(0, v));
          const layout = () => {
            const t = tl.time() + T0;
            const p = eExp(clamp((t - T.expand) / EXP));
            const sMark = S0 * (1 + 0.025 * clamp((t - T.mark) / (T.expand - T.mark)));
            const sEnd = 1 + 0.012 * clamp((t - T.expand - EXP) / (T.END - T.expand - EXP));
            const s = sMark * (1 - p) + sEnd * p;
            const xv = HAM_W + (GAP + WT) * p;  // visible width of the lockup, unscaled
            gsap.set(lock, { x: 540 - (xv * s) / 2, y: CY - (HAM_H / 2) * s, scale: s });
            word.style.clipPath = "inset(-30px " + ((WT + 40) * (1 - p) - 40).toFixed(2) + "px -30px -20px)";
          };
          tl.to({}, { duration: L(T.END) }, 0);  // span the whole scene: the lockup is laid out per frame until the end
          tl.eventCallback("onUpdate", layout);
          layout();
          window.__timelines["end"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
