      <script>
        (function () {
          const T = window.T;
          const root = document.getElementById("p-root");
          const $ = (s) => root.querySelector(s);
          window.ManooIcons.hydrate(root);
          const okIco = $("#p-isl .p-ic svg");
          if (okIco) okIco.id = "p-ic-ok";

          // ---------------------------------------------------------------- the phone as a 3D object
          // thickness: silhouettes stacked from the back (z -20) to just behind the screen face (z +16)
          const slabs = $("#p-slabs");
          for (let z = -20; z <= 16; z += 3) {
            const d = document.createElement("div");
            d.className = "p-slab" + (z >= 13 ? " hi" : "");
            d.style.transform = "translateZ(" + z + "px)";
            slabs.appendChild(d);
          }
          // side buttons (left: action + volume, right: power), a few layers deep so they read as bumps
          [[-5, 168, 30], [-5, 226, 56], [-5, 296, 56], [427, 250, 88]].forEach(([x, y, h]) => {
            for (const z of [-7, -1, 5]) {
              const b = document.createElement("div");
              b.className = "p-btn";
              b.style.cssText = "left:" + x + "px;top:" + y + "px;height:" + h + "px;transform:translateZ(" + z + "px)";
              slabs.appendChild(b);
            }
          });

          // ---------------------------------------------------------------- camera rig
          // perspective P from (540, 960); the phone centre sits at world (540, 1089) for x = y = 0.
          // A pose is { x, y, z, rx, ry } on #p-ph (GSAP order: rotateY(ry) rotateX(rx) applied to the points).
          const P = 2600, OX = 540, OY = 960, CX = 540, CY = 645 + 444;
          const R = Math.PI / 180;
          const rot = (v, rx, ry) => {
            const a = rx * R, b = ry * R;
            const y1 = v[1] * Math.cos(a) - v[2] * Math.sin(a), z1 = v[1] * Math.sin(a) + v[2] * Math.cos(a);
            return [v[0] * Math.cos(b) + z1 * Math.sin(b), y1, -v[0] * Math.sin(b) + z1 * Math.cos(b)];
          };
          // phone-local point (px from the phone's top-left, z from its mid-plane) → stage px
          const project = (pose, lx, ly, lz) => {
            const r = rot([lx - 215, ly - 444, lz], pose.rx, pose.ry);
            const X = CX + pose.x + r[0], Y = CY + pose.y + r[1], Z = pose.z + r[2];
            const k = P / (P - Z);
            return [OX + (X - OX) * k, OY + (Y - OY) * k, k];
          };
          const zFor = (k) => P * (1 - 1 / k);
          // the pose that puts phone-local point (lx, ly) at stage (sx, sy), seen at magnification k, turned rx / ry
          const aim = (lx, ly, sx, sy, k, rx, ry) => {
            const z = zFor(k);
            const r = rot([lx - 215, ly - 444, 20], rx, ry);
            const ks = P / (P - (z + r[2]));
            return { x: (sx - OX) / ks - r[0] - CX + OX, y: (sy - OY) / ks - r[1] - CY + OY, z, rx, ry };
          };
          // CLOSE: the top of the phone at y 330, twice its size; SHUT: down on the shutter, turned like the reference
          const CLOSE = { x: 0, y: 0, z: zFor(2), rx: 0, ry: 0 };
          const SHUTTER = [215, 790];
          const SHUT = aim(SHUTTER[0], SHUTTER[1], 540, 1150, 2.2, 15, 27);
          const plus = (a, d) => ({ x: a.x + (d.x || 0), y: a.y + (d.y || 0), z: a.z + (d.z || 0), rx: a.rx + (d.rx || 0), ry: a.ry + (d.ry || 0) });
          const KEYS = [
            // [t0, t1, from, to, ease]
            [T.rise - 0.001, T.rise + 0.9, plus(CLOSE, { y: 640 }), CLOSE, "power3.out"],
            [T.rise + 0.9, T.pill + 0.05, CLOSE, plus(CLOSE, { z: 16 }), "sine.inOut"],
            [T.pill + 0.05, T.land - 0.04, plus(CLOSE, { z: 16 }), SHUT, "power4.inOut"],
            [T.land - 0.04, T.swing, SHUT, plus(SHUT, { z: 22, ry: -2.5 }), "sine.out"],
            [T.swing, T.swing + 0.32, plus(SHUT, { z: 22, ry: -2.5 }), CLOSE, "power3.inOut"],
            [T.swing + 0.32, T.cut, CLOSE, plus(CLOSE, { z: 46 }), "sine.inOut"],
          ].map(([t0, t1, a, b, e]) => ({ t0, t1, a, b, e: gsap.parseEase(e) }));
          const poseAt = (t) => {
            let seg = KEYS[0];
            for (const s of KEYS) if (t >= s.t0) seg = s;
            const p = seg.e(Math.min(1, Math.max(0, (t - seg.t0) / (seg.t1 - seg.t0))));
            const o = {};
            for (const k of ["x", "y", "z", "rx", "ry"]) o[k] = seg.a[k] + (seg.b[k] - seg.a[k]) * p;
            return o;
          };
          // motion blur from the on-screen speed of a few points of the phone
          const PROBES = [[215, 444], [215, 60], [215, 828], [20, 444], [410, 444]];
          const blurAt = (t) => {
            const dt = 1 / 240, a = poseAt(t - dt), b = poseAt(t + dt);
            let vx = 0, vy = 0;
            for (const [lx, ly] of PROBES) {
              const p0 = project(a, lx, ly, 20), p1 = project(b, lx, ly, 20);
              vx = Math.max(vx, Math.abs(p1[0] - p0[0]) / (2 * dt));
              vy = Math.max(vy, Math.abs(p1[1] - p0[1]) / (2 * dt));
            }
            return [Math.min(30, vx / 210), Math.min(34, vy / 210)];
          };

          // ---------------------------------------------------------------- the flying pill (stage space)
          // it lands exactly on the shutter's inner disc as seen at the landing pose
          const landPose = poseAt(T.land);
          const landPt = project(landPose, SHUTTER[0], SHUTTER[1], 21);
          const landW = 66 * landPt[2] * Math.cos(landPose.ry * R), landH = 66 * landPt[2] * Math.cos(landPose.rx * R);
          const PILL = { t0: T.pill, t1: T.land, x0: 110, y0: 330, h0: 380, a0: 1.75 };
          const ex = gsap.parseEase("power2.inOut"), ey = gsap.parseEase("power3.out"), es = gsap.parseEase("power2.out"), ea = gsap.parseEase("power3.in");
          const pillAt = (t) => {
            const q = Math.min(1, Math.max(0, (t - PILL.t0) / (PILL.t1 - PILL.t0)));
            const s = es(q);
            const h = PILL.h0 + (landH - PILL.h0) * s;
            const aspect = PILL.a0 + (landW / landH - PILL.a0) * ea(q);
            return {
              x: PILL.x0 + (landPt[0] - PILL.x0) * ex(q),
              y: PILL.y0 + (landPt[1] - PILL.y0) * ey(q),
              w: h * aspect,
              h,
              rot: -16 * (1 - s),
            };
          };

          // ---------------------------------------------------------------- tweens (everything else)
          const tl = gsap.timeline({ paused: true });
          const at = (t) => +t.toFixed(3);
          const isl = $("#p-isl");
          // plate-local rectangles: idle pill (phone x 153, w 124), banner (x 24, w 382, h 96), compact (x 108, w 214);
          // drawn per frame as a clip-path (the browser rewrites inset() strings, so they are not tweened as text)
          const PLATE = { w: 398, h: 105 };
          const ISL = { idle: { x: 137, y: 0, w: 124, h: 36, r: 18 },
                        banner: { x: 8, y: 1, w: 382, h: 96, r: 40 },
                        compact: { x: 92, y: 0, w: 214, h: 36, r: 18 } };
          const ISL_OPEN = { t0: T.banner, d: 0.34, e: gsap.parseEase("back.out(1.25)") };
          const ISL_CLOSE = { t0: T.collapse + 0.04, d: 0.3, e: gsap.parseEase("power3.inOut") };
          const islandAt = (t) => {
            const mix = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, w: a.w + (b.w - a.w) * k, h: a.h + (b.h - a.h) * k, r: a.r + (b.r - a.r) * k });
            const clamp = (v) => Math.min(1, Math.max(0, v));
            if (t < ISL_CLOSE.t0) return mix(ISL.idle, ISL.banner, ISL_OPEN.e(clamp((t - ISL_OPEN.t0) / ISL_OPEN.d)));
            return mix(ISL.banner, ISL.compact, ISL_CLOSE.e(clamp((t - ISL_CLOSE.t0) / ISL_CLOSE.d)));
          };
          // the frozen frame: 394 x 560 → centre square 394 x 394 → 60 x 60 at phone (42, 30),
          // i.e. scale 60/394 about its centre (215, 402) while the square crop and the corner radius close in
          const SK = 60 / 394;
          const SNAP = { t0: T.banner - 0.03, d: 0.4, e: gsap.parseEase("power3.inOut") };
          // the camera window grows out of the Manoo icon (screen x 118-180, y 70-132) to the whole screen
          const OPEN = { t0: T.open, d: 0.42, e: gsap.parseEase("expo.out"), from: [70, 214, 720, 118, 15], to: [0, 0, 0, 0, 54] };

          // tap on the Manoo icon, the camera opens out of it
          tl.fromTo("#p-manoo-ico", { scale: 1 }, { scale: 0.86, duration: 0.09, ease: "power2.in", immediateRender: false }, at(T.tap - 0.05));
          tl.to("#p-manoo-ico", { scale: 1, duration: 0.22, ease: "back.out(2)" }, at(T.tap + 0.04));
          tl.fromTo("#p-press", { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, at(T.tap - 0.05));
          tl.to("#p-press", { opacity: 0, duration: 0.2 }, at(T.tap + 0.06));
          tl.fromTo("#p-tap", { opacity: 0.95, scale: 0.55 }, { opacity: 0, scale: 1.5, duration: 0.42, ease: "power2.out", immediateRender: false }, at(T.tap - 0.02));
          tl.set("#p-camv", { visibility: "visible" }, at(T.open));
          tl.fromTo("#p-camv-in", { scale: 0.32, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out", immediateRender: false }, at(T.open));
          tl.fromTo("#p-home-in", { scale: 1, opacity: 1 }, { scale: 1.14, opacity: 0.25, duration: 0.42, ease: "expo.out", immediateRender: false }, at(T.open));
          tl.set("#p-home", { visibility: "hidden" }, at(T.open + 0.45));
          // live viewfinder: a slow handheld drift, frozen by the shot
          tl.fromTo("#p-vf", { scale: 1.14, x: -10, y: 4 }, { scale: 1.06, x: 9, y: -3, duration: at(T.flash - T.open), ease: "sine.inOut", immediateRender: true }, at(T.open));
          tl.fromTo("#p-focus", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, at(T.land + 0.12));
          tl.to("#p-focus", { opacity: 0, duration: 0.14 }, at(T.press - 0.08));

          // the pill lands: the shutter turns Manoo orange, armed
          tl.set("#p-pill", { opacity: 1 }, at(T.pill));
          tl.to("#p-pill", { opacity: 0, duration: 0.07, ease: "none" }, at(T.land - 0.07));
          tl.fromTo("#p-sdisc", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "none", immediateRender: false }, at(T.land - 0.07));
          tl.fromTo("#p-sw", { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "none", immediateRender: false }, at(T.land - 0.07));
          tl.fromTo("#p-sglow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, at(T.land));
          tl.fromTo("#p-sglow", { scale: 1 }, { scale: 1.12, duration: 0.22, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, at(T.land + 0.02));
          // one press
          tl.to("#p-sdisc", { scale: 0.84, duration: 0.08, ease: "power2.in" }, at(T.press));
          tl.to("#p-sdisc", { scale: 1, duration: 0.24, ease: "back.out(2.2)" }, at(T.press + 0.08));
          tl.to("#p-sglow", { scale: 1.35, opacity: 1, duration: 0.1, ease: "power2.out" }, at(T.press + 0.04));
          tl.to("#p-sglow", { scale: 1, opacity: 0.85, duration: 0.3, ease: "power2.inOut" }, at(T.press + 0.14));
          tl.fromTo("#p-pulse", { opacity: 0.95, scale: 1 }, { opacity: 0, scale: 2.4, duration: 0.5, ease: "power2.out", immediateRender: false }, at(T.flash));
          tl.fromTo("#p-flash", { opacity: 0 }, { opacity: 0.92, duration: 0.04, immediateRender: false }, at(T.flash));
          tl.to("#p-flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, at(T.flash + 0.05));
          tl.fromTo("#p-cthumb-new", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2)", immediateRender: false }, at(T.flash + 0.06));

          // the shot freezes, the camera swings back up, Manoo is behind it
          tl.set("#p-snap", { opacity: 1 }, at(T.swing + 0.14));
          tl.set("#p-camv", { visibility: "hidden" }, at(T.swing + 0.14));
          tl.set("#p-prof", { visibility: "visible" }, at(T.swing + 0.14));
          // the photo flies into the island while it opens into the live banner
          tl.set("#p-snap", { opacity: 0 }, at(T.banner + 0.37));
          tl.set("#p-ib-thumb", { opacity: 1 }, at(T.banner + 0.37));
          tl.fromTo("#p-sbar2", { opacity: 1 }, { opacity: 0, duration: 0.12, immediateRender: false }, at(T.banner));
          tl.fromTo("#p-isl .p-ib", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", immediateRender: false }, at(T.banner + 0.16));
          tl.fromTo("#p-ib-arc", { attr: { "stroke-dashoffset": 119.38 } }, { attr: { "stroke-dashoffset": 0 }, duration: at(T.done - T.banner - 0.45), ease: "power1.inOut", immediateRender: false }, at(T.banner + 0.38));
          tl.fromTo("#p-ib-ok", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, at(T.done));
          tl.to("#p-ib-ring", { opacity: 0, duration: 0.12 }, at(T.done + 0.04));

          // the portfolio takes the new photo first
          const slot = (i) => [(i % 2) * 188, Math.floor(i / 2) * 166];
          root.querySelectorAll(".p-old").forEach((c, i) => {
            gsap.set(c, { x: slot(i)[0], y: slot(i)[1] });
            tl.to(c, { x: slot(i + 1)[0], y: slot(i + 1)[1], duration: 0.36, ease: "power3.inOut" }, at(T.cell - 0.14 + i * 0.03));
          });
          gsap.set("#p-cell-new", { x: 0, y: 0, scale: 0, opacity: 0 });
          tl.fromTo("#p-cell-new", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.7)", immediateRender: false }, at(T.cell));
          tl.fromTo("#p-cell-new", { boxShadow: "0 0 0 0px rgba(249,115,22,0)" }, { boxShadow: "0 0 0 4px rgba(249,115,22,0.95)", duration: 0.22, yoyo: true, repeat: 1, immediateRender: false }, at(T.cell + 0.36));

          // collapse to the compact island
          tl.to("#p-isl .p-ib", { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, at(T.collapse));
          tl.fromTo("#p-isl .p-ic", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", immediateRender: false }, at(T.collapse + 0.26));
          tl.to("#p-sbar2", { opacity: 1, duration: 0.16 }, at(T.collapse + 0.26));

          // ---------------------------------------------------------------- per-frame: camera, blur, pill, counters
          const ph = $("#p-ph"), cam = $("#p-cam"), mbg = $("#p-mb-g"), pill = $("#p-pill"), pbg = $("#p-mbp-g"), snap = $("#p-snap"), camv = $("#p-camv");
          const pct = $("#p-ib-pct"), t2 = $("#p-ib-t2"), npub = $("#p-npub");
          let doneShown = null;
          const render = () => {
            const t = tl.time();
            const pose = poseAt(t);
            gsap.set(ph, { x: pose.x, y: pose.y, z: pose.z, rotationX: pose.rx, rotationY: pose.ry });
            const [bx, by] = blurAt(t);
            if (bx + by > 0.4) {
              mbg.setAttribute("stdDeviation", bx.toFixed(2) + " " + by.toFixed(2));
              cam.style.filter = "url(#p-mb)";
            } else {
              cam.style.filter = "none";
            }
            if (t >= PILL.t0 && t <= PILL.t1) {
              const a = pillAt(t), b = pillAt(Math.min(PILL.t1, t + 1 / 240)), c = pillAt(Math.max(PILL.t0, t - 1 / 240));
              const span = (Math.min(PILL.t1, t + 1 / 240) - Math.max(PILL.t0, t - 1 / 240)) || 1;
              const vx = (b.x - c.x) / span, vy = (b.y - c.y) / span;
              const settle = 1 - Math.min(1, Math.max(0, ((t - PILL.t0) / (PILL.t1 - PILL.t0) - 0.8) / 0.2));
              gsap.set(pill, { x: a.x - a.w / 2, y: a.y - a.h / 2, width: a.w, height: a.h, borderRadius: Math.min(a.w, a.h) / 2, rotation: a.rot,
                               boxShadow: "0 " + (18 * settle).toFixed(1) + "px " + (50 * settle).toFixed(1) + "px rgba(226, 89, 11, " + (0.38 * settle).toFixed(3) + "), inset 0 -6px 16px rgba(160, 50, 0, 0.25), inset 0 6px 12px rgba(255, 220, 190, 0.45)" });
              pbg.setAttribute("stdDeviation", Math.min(30, Math.abs(vx) / 170).toFixed(2) + " " + Math.min(30, Math.abs(vy) / 170).toFixed(2));
            }
            const o = OPEN.e(Math.min(1, Math.max(0, (t - OPEN.t0) / OPEN.d)));
            const ins = OPEN.from.map((v, i) => (v + (OPEN.to[i] - v) * o).toFixed(2));
            camv.style.clipPath = "inset(" + ins[0] + "px " + ins[1] + "px " + ins[2] + "px " + ins[3] + "px round " + ins[4] + "px)";
            const R = islandAt(t);
            isl.style.clipPath = "inset(" + R.y.toFixed(2) + "px " + (PLATE.w - R.x - R.w).toFixed(2) + "px " + (PLATE.h - R.y - R.h).toFixed(2) + "px " + R.x.toFixed(2) + "px round " + R.r.toFixed(2) + "px)";
            const q = SNAP.e(Math.min(1, Math.max(0, (t - SNAP.t0) / SNAP.d)));
            gsap.set(snap, { x: (72 - 215) * q, y: (60 - 402) * q, scale: 1 + (SK - 1) * q });
            snap.style.clipPath = "inset(" + (83 * q).toFixed(2) + "px 0px " + (83 * q).toFixed(2) + "px 0px round " + ((16 / SK) * q).toFixed(2) + "px)";
            const k = Math.min(1, Math.max(0, (t - (T.banner + 0.38)) / (T.done - T.banner - 0.45)));
            const done = t >= T.done;
            if (done !== doneShown) {
              t2.innerHTML = done ? "Ajouté à ton portfolio" : 'Envoi… <b id="p-ib-pct">0 %</b>';
              doneShown = done;
            }
            const pctEl = root.querySelector("#p-ib-pct");
            if (pctEl) pctEl.textContent = Math.round(gsap.parseEase("power1.inOut")(k) * 100) + " %";
            npub.textContent = t >= T.cell + 0.05 ? "5" : "4";
          };
          tl.to({}, { duration: T.cut }, 0);  // the timeline spans the whole scene, so the camera keeps moving to the cut
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["phone"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
