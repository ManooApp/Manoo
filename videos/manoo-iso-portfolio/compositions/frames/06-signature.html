      <div data-hf-id="hf-ybjr" id="root" data-composition-id="signature" data-width="1920" data-height="1080">
        <div data-hf-id="hf-ufrd" id="s-row1" data-layout-allow-overflow="">
          <div data-hf-id="hf-hstg" id="s-square"><img data-hf-id="hf-xd6s" id="s-icon" src="assets/brand/manoo-marteau.png" alt=""></div>
          <div data-hf-id="hf-1knp" id="s-word"><span data-hf-id="hf-vcyu" class="s-l">M</span><span data-hf-id="hf-qlai" class="s-l">A</span><span data-hf-id="hf-vr9v" class="s-l">N</span><span data-hf-id="hf-w5kw" class="s-l">O</span><span data-hf-id="hf-jvaw" class="s-l">O</span><span data-hf-id="hf-vaa3" id="s-dot"></span></div>
        </div>
        <div data-hf-id="hf-iypg" id="s-tag" data-layout-allow-overflow=""><span data-hf-id="hf-9ryf" class="w">La</span> <span data-hf-id="hf-tqi7" class="w">révolution</span> <span data-hf-id="hf-fmk3" class="w">du</span> <span data-hf-id="hf-5483" class="w">regard.</span></div>
        <div data-hf-id="hf-ydve" id="s-row2" data-layout-allow-overflow="">
          <div data-hf-id="hf-3qkx" id="s-cta">Demander une présentation <span data-hf-id="hf-95a5" id="s-arrow">→</span><div data-hf-id="hf-cet7" id="s-halo"></div></div>
          <div data-hf-id="hf-su5g" id="s-site">manoo.fr</div>
        </div>
      </div>

      <script>
        (function () {
          const C = window.CUES;
          const T0 = 35.4; // host data-start (film time)
          const L = (t) => t - T0;
          const build = () => {
            const tl = gsap.timeline({ paused: true });
            const sq = document.getElementById("s-square");
            const word = document.getElementById("s-word");
            // centre the square on screen before the wordmark arrives
            const shift = (word.offsetWidth + 46) / 2;
            tl.fromTo(sq, { opacity: 0, scale: 0, x: shift, filter: "blur(18px)" }, { opacity: 1, scale: 1, x: shift, filter: "blur(0px)", duration: 0.42, ease: "back.out(2.2)" }, 0.15);
            tl.fromTo("#s-icon", { opacity: 0, scale: 0.2, rotation: -24 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)" }, L(C.manoo));
            tl.to(sq, { scale: 0.9, duration: 0.09, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(C.manoo));
            tl.to(sq, { x: 0, duration: 0.46, ease: "power3.out" }, L(C.manoo) + 0.2);
            tl.fromTo(
              "#s-word .s-l",
              { opacity: 0, y: 60, filter: "blur(14px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "back.out(1.8)", stagger: 0.055 },
              L(C.manoo) + 0.5,
            );
            tl.fromTo("#s-dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)" }, L(C.manoo) + 0.9);
            tl.fromTo("#s-tag .w", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out", stagger: 0.07 }, L(C.regard) - 0.05);
            tl.fromTo("#s-cta", { opacity: 0, scale: 0.6, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.9)" }, L(C.demandez));
            tl.fromTo("#s-arrow", { x: -14 }, { x: 0, duration: 0.5, ease: "power3.out" }, L(C.demandez) + 0.15);
            // the "tap" (after the reference's cursor click, without a cursor arrow)
            const tap = L(C.demandez) + 0.78;
            tl.to("#s-cta", { scale: 0.94, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut" }, tap);
            tl.fromTo("#s-halo", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 3.2, duration: 0.6, ease: "power2.out" }, tap);
            tl.fromTo("#s-site", { opacity: 0, x: 30, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, L(C.site) - 0.15);
            // keep the hold alive: a near-imperceptible push on the whole lockup
            tl.fromTo(["#s-row1", "#s-tag", "#s-row2"], { scale: 1 }, { scale: 1.035, duration: 9.6 - L(C.regard), ease: "none", transformOrigin: "50% 60%" }, L(C.regard));
            window.__timelines["signature"] = tl;
          };
          document.fonts.load('800 188px "Archivo"').then(build);
        })();
      </script>
