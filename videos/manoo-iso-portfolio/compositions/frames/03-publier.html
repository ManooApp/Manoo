      <script>
        (function () {
          const C = window.CUES;
          const T0 = 13.4; // host data-start (film time)
          const L = (t) => t - T0;
          const tl = gsap.timeline({ paused: true });
          const popIn = (sel, at, o = {}) =>
            tl.fromTo(
              sel,
              { opacity: 0, scale: o.s ?? 1.4, y: o.y ?? 24, filter: "blur(14px)" },
              { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: o.d ?? 0.34, ease: o.e ?? "back.out(1.7)" },
              at,
            );
          tl.fromTo("#p-tag1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, L(C.unePhoto) - 0.15);
          popIn("#p-une", L(C.unePhoto));
          popIn("#p-photo", L(C.unePhoto) + 0.15);
          popIn("#p-un", L(C.unTitre));
          popIn("#p-titre", L(C.unTitre) + 0.14, { s: 1.7, e: "back.out(2.4)" });
          tl.to("#p-left", { x: -90, opacity: 0, filter: "blur(16px)", duration: 0.3, ease: "power2.in" }, L(C.chaque) + 0.15);
          tl.fromTo("#p-tag2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, L(C.rejoint) - 0.2);
          popIn("#p-leur", L(C.portfolio) - 0.12);
          popIn("#p-port", L(C.portfolio));
          popIn("#p-vis", L(C.visuel), { s: 1.7, e: "back.out(2.4)" });
          tl.to("#p-right", { x: 80, opacity: 0, filter: "blur(16px)", duration: 0.3, ease: "power2.in" }, L(19.15));
          window.__timelines["publier"] = tl;
        })();
