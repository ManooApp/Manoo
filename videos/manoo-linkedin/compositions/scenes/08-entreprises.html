        #e-mapl { position: absolute; left: 22px; bottom: 20px; height: 54px; padding: 0 20px; border-radius: 27px; background: #fff; display: flex; align-items: center; gap: 10px; font: 700 24px/1 "Inter Display", sans-serif; color: #0e1012; box-shadow: 0 10px 24px rgba(16, 22, 25, 0.12); }

        #e-like { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); height: 56px; padding: 0 22px; border-radius: 28px; background: rgba(255, 255, 255, 0.95); display: flex; align-items: center; gap: 10px; white-space: nowrap; font: 600 22px/1 "Inter", sans-serif; color: #0e1012; opacity: 0; }
        #e-like .e-logo { width: 36px; height: 36px; border-radius: 10px; font-size: 13px; }
        #e-notif { position: absolute; left: 90px; top: 1210px; width: 900px; opacity: 0; }
        #e-notif .nb { display: flex; gap: 20px; align-items: center; padding: 26px 30px; border-radius: 40px; background: rgba(255, 255, 255, 0.97); box-shadow: 0 40px 90px rgba(16, 22, 25, 0.22), 0 0 0 1px rgba(16, 22, 25, 0.04); }
        #e-notif .ni { width: 78px; height: 78px; border-radius: 20px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); flex: none; }
        #e-notif .ni img { width: 54px; height: 47px; object-fit: contain; }
        #e-notif .nt { display: flex; justify-content: space-between; font: 700 28px/1.2 "Inter", sans-serif; color: #0e1012; }
        #e-notif .nt span { font-weight: 500; font-size: 22px; color: #8a9297; }
        #e-notif .nd { margin-top: 6px; font: 400 26px/1.35 "Inter", sans-serif; color: #2e2721; }
        #e-bloom { position: absolute; left: -200px; right: -200px; top: 1350px; height: 900px; border-radius: 50%; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(249, 115, 22, 0.55) 0%, rgba(249, 115, 22, 0.16) 45%, rgba(249, 115, 22, 0) 72%); opacity: 0; }
      </style>

      <div data-hf-id="hf-n2g5" id="e-root" data-composition-id="entreprises" data-width="1080" data-height="1920">
        <div data-hf-id="hf-buim" class="stg day">
          <div data-hf-id="hf-7v6j" id="e-bloom" data-layout-allow-overflow></div>
          <div data-hf-id="hf-fx3b" class="mui">
            <div data-hf-id="hf-qwse" id="e-co" class="e-x2">
              <div data-hf-id="hf-a043" id="e-coc" class="card">
                <div data-hf-id="hf-6y1m" class="e-co-top"><div data-hf-id="hf-ww7d" class="e-logo">AM</div><div data-hf-id="hf-yeow"><div data-hf-id="hf-eno5" class="e-co-nm">Atelier Morvan</div><div data-hf-id="hf-b76z" class="e-co-mt">Métallerie · <span data-hf-id="hf-t2za" id="e-loc"><i data-hf-id="hf-tr9e" data-icon="map-pin"></i>Rennes (35)</span></div></div><span data-hf-id="hf-en8x" class="e-badge">Entreprise</span></div>
              </div>
            </div>
            <div data-hf-id="hf-rb4f" id="e-posts" class="e-x2" style="top:780px" data-layout-allow-overlap>
              <div data-hf-id="hf-yd2n" id="e-p1" class="card e-post"><div data-hf-id="hf-wx9a" class="im"><img data-hf-id="hf-leqq" src="assets/photos/B1.jpg" alt=""><span data-hf-id="hf-e0ri" class="chip sel tg"><i data-hf-id="hf-hjuo" data-icon="hammer"></i>Chantier</span></div><div data-hf-id="hf-zcn4" class="tx">Garde-corps posé à Cesson-Sévigné, sur muret.</div><div data-hf-id="hf-a8f6" class="mt">Atelier Morvan • hier</div></div>
              <div data-hf-id="hf-nhl0" id="e-p2" class="card e-post"><div data-hf-id="hf-9gst" class="e-team"><span data-hf-id="hf-d5gq">PM</span><span data-hf-id="hf-cq7g">SR</span><span data-hf-id="hf-yt0u">KD</span><span data-hf-id="hf-b3fr" class="o">LÉ</span></div><div data-hf-id="hf-w9rw" class="tx" style="margin-top:12px">Bienvenue à Léa, notre nouvelle alternante en métallerie !</div><div data-hf-id="hf-bivh" class="mt">Atelier Morvan • Équipe</div></div>
              <div data-hf-id="hf-o98t" id="e-p3" class="card e-post"><div data-hf-id="hf-caiq" class="im"><img data-hf-id="hf-l5aq" src="assets/photos/C2.jpg" alt=""><span data-hf-id="hf-47r9" class="pl">▶</span><span data-hf-id="hf-5w3a" class="chip sel tg"><i data-hf-id="hf-kxjx" data-icon="eye"></i>Coulisses</span></div><div data-hf-id="hf-6oy0" class="tx">Une journée à l'atelier, de la découpe à la soudure.</div><div data-hf-id="hf-jbuv" class="mt">Atelier Morvan • vidéo 0:42</div></div>

          <div data-hf-id="hf-tvof" id="e-map">

            <div data-hf-id="hf-2b6q" class="rd" style="left:0;right:0;top:230px;height:12px"></div>
            <div data-hf-id="hf-vpeh" class="rd" style="top:0;bottom:0;left:150px;width:14px"></div>
            <div data-hf-id="hf-du3j" class="rd" style="top:0;bottom:0;left:390px;width:18px"></div>
            <div data-hf-id="hf-90pz" class="rd" style="left:-40px;width:700px;top:40px;height:12px;transform:rotate(14deg)"></div>
            <div data-hf-id="hf-lj8w" id="e-pin"><b data-hf-id="hf-xujp"></b><i data-hf-id="hf-wt6k"></i></div>
            <div data-hf-id="hf-ekfd" id="e-mapl"><i data-hf-id="hf-8b6u" data-icon="map-pin"></i>Rennes · près de chez toi</div>
          </div>
          <div data-hf-id="hf-n270" id="e-work"><img data-hf-id="hf-3te2" src="assets/photos/jules-portail.jpg" alt=""><div data-hf-id="hf-wwgl" id="e-heart"><i data-hf-id="hf-lsgu" data-icon="heart"></i></div><div data-hf-id="hf-pq6v" id="e-like"><span data-hf-id="hf-escs" class="e-logo">AM</span>Atelier Morvan aime ta réalisation</div></div>
          <div data-hf-id="hf-tnt7" id="e-notif"><div data-hf-id="hf-xjjk" class="nb"><div data-hf-id="hf-zumr" class="ni"><img data-hf-id="hf-2mif" src="assets/brand/manoo-marteau.png" alt=""></div><div data-hf-id="hf-9air" style="flex:1;min-width:0"><div data-hf-id="hf-w2qd" class="nt">Atelier Morvan<span data-hf-id="hf-tnw4">maintenant</span></div><div data-hf-id="hf-nabv" class="nd">Bonjour Jules ! Votre portail est superbe. On en parle ?</div></div></div></div>

          <div data-hf-id="hf-ysvz" id="e-k15a" class="kt" data-line="15"><span data-hf-id="hf-iupx" class="m">Les entreprises, elles,</span><br data-hf-id="hf-x5px">montrent leurs…</div>
          <div data-hf-id="hf-tpc7" id="e-k15b" class="kt" data-line="15" data-from="près"><span data-hf-id="hf-f8z0" class="pill">près de chez toi.</span></div>
          <div data-hf-id="hf-553c" id="e-k16" class="kt" data-line="16">Ton travail leur plaît ?<br data-hf-id="hf-rsrt"><span data-hf-id="hf-fybv" class="pill">Elles te contactent.</span></div>

      <script>
        (function () {
          const T0 = window.CUES.S.entreprises[0];
          const END = T0 + window.CUES.S.entreprises[1];
          const L = (t) => +(t - T0).toFixed(3);
          const W = window.W, LS = window.LS, LE = window.LE;
          const root = document.getElementById("e-root");
          const $ = (s) => root.querySelector(s);
          window.ManooIcons.hydrate(root);
          // the posts fan out like a hand of cards: each one lands over part of the previous one
          root.querySelectorAll("#e-p1 *, #e-p2 *").forEach((e) => e.setAttribute("data-layout-allow-occlusion", ""));
          gsap.set(".e-x2", { scale: 2 });
          // the posts fan out under the company card: [x, y, rotation] in the x2 frame
          const FAN = [[-15, 0, -6], [75, 60, 2], [165, 10, 7]];

          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            // ---- L15: the company shows its world
            tl.fromTo("#e-coc", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out", immediateRender: true }, L(W(15, "entreprises") - 0.1));
            ["chantiers", "équipes", "coulisses"].forEach((w, i) => {
              const [x, y, r] = FAN[i];
              tl.fromTo(`#e-p${i + 1}`, { opacity: 0, x: x * 0.4, y: y + 120, rotation: 0, scale: 0.8 }, { opacity: 1, x, y, rotation: r, scale: 0.86, duration: 0.42, ease: "back.out(1.5)", immediateRender: true }, L(W(15, w) - 0.08));
            });
            window.KT.animate(tl, $("#e-k15a"), T0, { out: W(15, "près") - 0.24 });
            // « près de chez toi » — the posts gather, the map pins Rennes
            const tN = W(15, "près");
            tl.to("#e-posts", { y: -60, scale: 1.6, opacity: 0.25, filter: "blur(4px)", duration: 0.4, ease: "power3.inOut" }, L(tN - 0.14));
            tl.fromTo("#e-map", { opacity: 0, y: 60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.5)", immediateRender: true }, L(tN - 0.08));
            tl.fromTo("#e-pin i", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: true }, L(tN + 0.08));
            tl.fromTo("#e-pin b", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.8, duration: 0.7, ease: "power2.out", immediateRender: false }, L(tN + 0.12));
            tl.fromTo("#e-loc", { backgroundColor: "rgba(249,115,22,0)", color: "#807368" }, { backgroundColor: "rgba(249,115,22,0.16)", color: "#a8481f", duration: 0.25, immediateRender: false }, L(tN));
            window.KT.animate(tl, $("#e-k15b"), T0, { out: LE(15) + 0.1 });
            // ---- L16: Jules' work catches their eye — they get in touch
            const tW = LS(16) - 0.12;
            tl.to(["#e-co", "#e-posts", "#e-map"], { opacity: 0, y: -80, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, L(tW - 0.1));
            tl.fromTo("#e-work", { opacity: 0, y: 60, scale: 0.92, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: true }, L(tW));
            const tLike = W(16, "plaît");
            tl.fromTo("#e-heart", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1.2, duration: 0.22, ease: "back.out(3)", immediateRender: false }, L(tLike - 0.06));
            tl.to("#e-heart", { opacity: 0, scale: 1.5, duration: 0.3, ease: "power2.in" }, L(tLike + 0.32));
            tl.fromTo("#e-like", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.26, ease: "back.out(1.6)", immediateRender: false }, L(tLike + 0.05));
            const tC = W(16, "Elles");
            tl.to("#e-work", { y: -120, scale: 0.86, duration: 0.5, ease: "power3.inOut" }, L(tC - 0.1));
            tl.fromTo("#e-notif", { opacity: 0, y: 80, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.5)", immediateRender: true }, L(tC));
            tl.fromTo("#e-bloom", { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", immediateRender: true }, L(tC - 0.05));
            window.KT.animate(tl, $("#e-k16"), T0, { out: END - 0.22 });
            // exit
            tl.to(["#e-work", "#e-notif"], { opacity: 0, scale: 0.92, filter: "blur(10px)", duration: 0.24, ease: "power2.in" }, L(END - 0.26));
            tl.to("#e-bloom", { opacity: 0, duration: 0.3 }, L(END - 0.3));
            window.__timelines["entreprises"] = tl;
          });
        })();
      </script>
    </template>
  </body>
