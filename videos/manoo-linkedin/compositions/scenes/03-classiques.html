      <script>
        (function () {
          const T0 = window.CUES.S.classiques[0];
          const END = T0 + window.CUES.S.classiques[1];
          const L = (t) => +(t - T0).toFixed(3);
          const W = window.W, LS = window.LS, LE = window.LE;
          const root = document.getElementById("c-root");
          const $ = (s) => root.querySelector(s);
          window.ManooIcons.hydrate(root);

          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            // carousel slots: in (from the right) → centre → aside (left, small, dim) → gone
            const SL = {
              in: { x: 720, scale: 0.9, rotationY: -24, opacity: 0, filter: "blur(10px)" },
              mid: { x: 0, scale: 1, rotationY: 0, opacity: 1, filter: "blur(0px)" },
              side: { x: -560, scale: 0.78, rotationY: 20, opacity: 0.35, filter: "blur(3px)" },
              gone: { x: -1000, scale: 0.6, rotationY: 30, opacity: 0, filter: "blur(12px)" },
            };
            const move = (sel, a, b, at, dur = 0.55) => tl.fromTo(sel, { ...SL[a] }, { ...SL[b], duration: dur, ease: "power3.inOut", immediateRender: a === "in" && at < 0.5 }, L(at));
            const cut2 = LS(5) - 0.2, cut3 = LS(6) - 0.2;
            move("#c-a", "in", "mid", T0 + 0.08, 0.6);
            move("#c-a", "mid", "side", cut2);
            move("#c-b", "in", "mid", cut2);
            move("#c-a", "side", "gone", cut3);
            move("#c-b", "mid", "side", cut3);
            move("#c-c", "in", "mid", cut3);
            gsap.set(["#c-b", "#c-c"], { ...SL.in });
            // the limit of each one, stamped when the voice names it
            const stamp = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 1.6, rotation: -8 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, L(at));
            stamp("#c-sa", W(4, "bureaux"));
            stamp("#c-sb", W(5, "CV"));
            tl.fromTo("#c-cvfile", { scale: 1 }, { scale: 1.08, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, L(W(5, "CV")));
            tl.fromTo("#c-cvfile", { boxShadow: "inset 0 0 0 2px #e1e4e6" }, { boxShadow: "inset 0 0 0 3px #f97316", duration: 0.2, immediateRender: false }, L(W(5, "CV")));
            stamp("#c-sc", W(6, "ponctuel"));
            // captions
            window.KT.animate(tl, $("#c-k1"), T0, { out: cut2 - 0.05 });
            window.KT.animate(tl, $("#c-k2"), T0, { out: cut3 - 0.05 });
            window.KT.animate(tl, $("#c-k3"), T0, { out: END - 0.24 });
            // exit: the cards drop away
            tl.to(["#c-b", "#c-c"], { y: 260, opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power2.in", stagger: 0.04 }, L(END - 0.32));
            window.__timelines["classiques"] = tl;
          });
        })();
      </script>
