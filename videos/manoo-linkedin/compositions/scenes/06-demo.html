      <script>
        (function () {
          const T0 = window.CUES.S.demo[0];
          const END = T0 + window.CUES.S.demo[1];
          const L = (t) => +(t - T0).toFixed(3);
          const W = window.W, LE = window.LE;
          const root = document.getElementById("d-root");
          const $ = (s) => root.querySelector(s);
          window.ManooIcons.hydrate(root);
          // the composer is pushed under the profile screen (iOS-style navigation): its text is meant to be covered
          root.querySelectorAll("#d-s1 *").forEach((e) => e.setAttribute("data-layout-allow-occlusion", ""));
          const S = 1.15;

          document.fonts.ready.then(() => {
            // tap target, measured once with the scene laid out (stage coordinates)
            const pubPt = window.KT.withLayout($("#d-pub"), () => {
              const sc = $("#d-ph .screen").getBoundingClientRect(), r = $("#d-pub").getBoundingClientRect();
              const k = 394 / sc.width;
              const sx = (r.left + r.width / 2 - sc.left) * k, sy = (r.top + r.height / 2 - sc.top) * k;
              return [540 + (18 + sx - 215) * S, 1110 + (18 + sy - 444) * S];
            });
            const tl = gsap.timeline({ paused: true });
            const tP = W(10, "Photos"), tV = W(10, "vidéos"), tPub = W(10, "publies");
            // ---- « Tu termines un chantier ? » — the footage card
            tl.fromTo("#d-card", { opacity: 0, y: 80, scale: 0.92, filter: "blur(12px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: true }, 0.02);
            tl.fromTo("#d-card", { rotation: -1 }, { rotation: 1, duration: 2.4, ease: "sine.inOut", immediateRender: true }, 0.1);
            window.KT.animate(tl, $("#d-ka"), T0, { out: tP - 0.24 });
            // « Photos » — flash ; « vidéos » — recording
            tl.fromTo("#d-flash", { opacity: 0 }, { opacity: 0.9, duration: 0.05, immediateRender: false }, L(tP - 0.02));
            tl.to("#d-flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, L(tP + 0.05));
            tl.fromTo("#d-hud", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, L(tV - 0.04));
            // each caption is gone before the next one's first word
            window.KT.animate(tl, $("#d-kb"), T0, { out: Math.min(LE(10), window.LS(11) - 0.24) });
            // the card dives into the phone, which rises with the composer
            gsap.set("#d-ph", { scale: S, opacity: 0, y: 900 });
            gsap.set("#d-s2", { xPercent: 100 });
            tl.to("#d-card", { scale: 0.42, x: -40, y: 220, opacity: 0, filter: "blur(6px)", duration: 0.42, ease: "power3.in" }, L(tPub - 0.5));
            tl.fromTo("#d-ph", { opacity: 1, y: 900, rotationX: 16 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, L(tPub - 0.42));
            // tap « Publier »
            tl.fromTo("#d-finger", { opacity: 0, x: pubPt[0], y: pubPt[1], scale: 1.4 }, { opacity: 1, x: pubPt[0], y: pubPt[1], scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, L(tPub + 0.02));
            tl.to("#d-finger", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(tPub + 0.14));
            tl.to("#d-finger", { opacity: 0, duration: 0.14 }, L(tPub + 0.34));
            tl.fromTo("#d-ring", { opacity: 0.95, x: pubPt[0], y: pubPt[1], scale: 0.4 }, { opacity: 0, x: pubPt[0], y: pubPt[1], scale: 1.6, duration: 0.45, ease: "power2.out", immediateRender: false }, L(tPub + 0.14));
            tl.to("#d-pub", { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(tPub + 0.14));
            // ---- « Ton profil devient une vraie vitrine » — the profile, then the showcase around it
            const tPf = window.LS(11) - 0.1;
            tl.to("#d-s1", { xPercent: -30, opacity: 0, duration: 0.36, ease: "power3.out" }, L(tPf));
            tl.fromTo("#d-s2", { xPercent: 100 }, { xPercent: 0, duration: 0.36, ease: "power3.out", immediateRender: false }, L(tPf));
            tl.fromTo("#d-toast", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, L(tPf + 0.12));
            tl.to("#d-toast", { opacity: 0, y: -16, duration: 0.24 }, L(tPf + 1.2));
            tl.fromTo("#d-new", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, L(tPf + 0.3));
            tl.to("#d-ph", { y: 40, scale: S * 0.98, duration: 1.6, ease: "sine.inOut" }, L(tPf + 0.3));
            const FL = [["#d-f1", 70, 760, -4], ["#d-f2", 760, 870, 3], ["#d-f3", 60, 1300, 3], ["#d-f4", 690, 1400, -3]];
            FL.forEach(([sel, x, y, r], i) => {
              tl.fromTo(sel, { opacity: 0, x: x + (x < 400 ? -80 : 80), y: y + 20, rotation: r * 2, scale: 0.8, filter: "blur(10px)" },
                { opacity: 1, x, y, rotation: r, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, L(W(11, "devient") - 0.1 + i * 0.12));
              tl.to(sel, { y: y - 16, duration: 1.2, ease: "sine.inOut" }, L(W(11, "devient") + 0.4 + i * 0.12));
            });
            tl.fromTo("#d-glow", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, L(W(11, "vitrine") - 0.04));
            window.KT.animate(tl, $("#d-kc"), T0, { out: END - 0.22 });
            // exit
            tl.to(["#d-ph", "#d-glow", "#d-f1", "#d-f2", "#d-f3", "#d-f4"], { opacity: 0, scale: 0.9, filter: "blur(12px)", duration: 0.24, ease: "power2.in" }, L(END - 0.26));
            // time-driven: publication count and screen visibility
            const npub = $("#d-npub"), s1 = $("#d-s1"), s2 = $("#d-s2");
            const render = () => {
              const t = tl.time();
              npub.textContent = t >= L(tPf + 0.3) ? "13" : "12";
              s1.style.visibility = t < L(tPf + 0.36) ? "visible" : "hidden";
              s2.style.visibility = t >= L(tPf) ? "visible" : "hidden";
            };
            tl.eventCallback("onUpdate", render);
            render();
            window.__timelines["demo"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
