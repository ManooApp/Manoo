      <script>
        (function () {
          const C = window.CUES;
          const T0 = 19.0;
          const L = (t) => +(t - T0).toFixed(3);
          const root = document.getElementById("v-root");
          const $ = (s) => root.querySelector(s);

          // portfolio cells: photo + title, two columns
          const CELLS = [
            ["jules-portail", "Portail en fer forgé"], ["garde-corps", "Garde-corps acier"],
            ["escalier", "Escalier droit"], ["portail-detail", "Volutes, détail"],
            ["A3", "Râtelier à barres"], ["C2", "Établi soudé"],
            ["A2", "Portail, pose"], ["A1", "Anneaux forgés"],
          ];
          const slot = (i) => [(i % 2) * 188, Math.floor(i / 2) * 160];
          const grid = $("#v-grid");
          const cells = CELLS.map(([src, t], i) => {
            const ph = document.createElement("div");
            ph.className = "ph";
            grid.appendChild(ph);
            const c = document.createElement("div");
            c.className = "cell";
            c.innerHTML = `<img src="assets/photos/${src}.jpg" alt=""><div class="cell-t">${t}</div>`;
            grid.appendChild(c);
            gsap.set([ph, c], { x: slot(i)[0], y: slot(i)[1] });
            return c;
          });
          window.ManooIcons.hydrate(root);

          // double-tap like on « Volutes, détail » once the grid has scrolled (screen coordinates)
          const SCROLL = 250;
          const HEART = [14 + slot(3)[0] + 89, 366 + slot(3)[1] + 75 - SCROLL];
          gsap.set("#v-heart", { x: HEART[0], y: HEART[1] });
          gsap.set(["#v-pa", "#v-pb"], { opacity: 0 });
          gsap.set("#v-chip", { xPercent: -50 });

          const tl = gsap.timeline({ paused: true });
          // split: the dark half wipes in, both phones rise
          tl.fromTo("#v-dark", { x: -540 }, { x: 0, duration: 0.3, ease: "power3.out", immediateRender: true }, L(C.split));
          tl.fromTo("#v-lab-a", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out", immediateRender: true }, L(C.split + 0.06));
          tl.fromTo("#v-lab-b", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out", immediateRender: true }, L(C.split + 0.12));
          tl.fromTo("#v-pa", { opacity: 1, y: 1300 }, { opacity: 1, y: 0, duration: 0.44, ease: "power3.out", immediateRender: false }, L(C.split + 0.04));
          tl.fromTo("#v-pb", { opacity: 1, y: 1300 }, { opacity: 1, y: 0, duration: 0.44, ease: "power3.out", immediateRender: false }, L(C.split + 0.1));
          // Avant: the grey page barely moves
          tl.fromTo("#v-page", { y: 0 }, { y: -70, duration: +(L(C.out5) - L(C.split + 0.5)).toFixed(3), ease: "none", immediateRender: true }, L(C.split + 0.5));
          // Après: photos land one by one on the beat
          cells.forEach((c, i) => {
            tl.fromTo(c, { opacity: 0, scale: 0.4, x: slot(i)[0], y: slot(i)[1] }, { opacity: 1, scale: 1, x: slot(i)[0], y: slot(i)[1], duration: 0.34, ease: "back.out(1.8)", immediateRender: true }, L(C.fill + i * 0.075));
          });
          tl.fromTo("#v-chip", { opacity: 0, scale: 0.5, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "back.out(2.2)", immediateRender: true }, L(C.chip5));
          // the portfolio scrolls: more work below
          tl.fromTo("#v-scroll", { y: 0 }, { y: -SCROLL, duration: 0.7, ease: "power2.inOut", immediateRender: true }, L(C.scroll5));
          gsap.set("#v-heart", { scale: 0 });
          tl.fromTo("#v-heart", { opacity: 0, scale: 0, y: HEART[1] }, { opacity: 1, scale: 1.25, y: HEART[1], duration: 0.2, ease: "back.out(3)", immediateRender: false }, L(C.heart5));
          tl.to("#v-heart", { scale: 1, duration: 0.12, ease: "power2.out" }, L(C.heart5 + 0.2));
          tl.to("#v-heart", { opacity: 0, scale: 1.4, y: HEART[1] - 50, duration: 0.3, ease: "power2.in" }, L(C.heart5 + 0.5));
          // exit: phones drop, labels lift, the dark half slides away
          tl.to(["#v-pa", "#v-pb"], { y: 1200, filter: "blur(14px)", duration: 0.32, ease: "power3.in", stagger: 0.04 }, L(C.out5));
          tl.to(["#v-lab-a", "#v-lab-b", "#v-chip"], { opacity: 0, y: -40, filter: "blur(12px)", duration: 0.24, ease: "power2.in", stagger: 0.02 }, L(C.out5));
          tl.to("#v-dark", { x: -540, duration: 0.3, ease: "power3.in" }, L(C.out5 + 0.06));
          window.__timelines["avantapres"] = tl;
        })();
      </script>
