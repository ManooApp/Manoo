      <script>
        (function () {
          const C = window.CUES;
          const T0 = 23.0;
          function L(t) { return +(t - T0).toFixed(3); }
          const root = document.getElementById("r-root");
          const $ = (s) => root.querySelector(s);
          window.ManooIcons.hydrate(root);

          // phone geometry as in « Ton portfolio »: 430 x 888 box centred at (540, 1040), scaled S
          const S = 1.46;
          const screenEl = $("#r-screen");
          // measure every tap once, at build time, before anything moves (stage coordinates)
          const PT = {};
          {
            const sr = screenEl.getBoundingClientRect();
            const k = 394 / sr.width;
            for (const [key, sel] of [["loc", "#r-loc"], ["card", "#r-c0"], ["follow", "#r-follow"], ["msg", "#r-msg"], ["send", "#r-send"]]) {
              const r = root.querySelector(sel).getBoundingClientRect();
              const sx = (r.left + r.width / 2 - sr.left) * k, sy = (r.top + r.height / 2 - sr.top) * k;
              PT[key] = [540 + (18 + sx - 215) * S, 1040 + (18 + sy - 444) * S];
            }
          }

          const SCREENS = ["#r-s-search", "#r-s-pf", "#r-s-chat"].map((s) => $(s));
          gsap.set(["#r-s-pf", "#r-s-chat"], { xPercent: 100 });
          gsap.set(["#r-ph", "#r-ph2"], { scale: S, opacity: 0, y: 760 });
          gsap.set("#r-ph2", { y: 0, x: 1200 });
          gsap.set([".r-cap", "#r-fin .w"], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          const screenIn = (s, at) => tl.fromTo(s, { xPercent: 100, opacity: 1 }, { xPercent: 0, opacity: 1, duration: 0.36, ease: "power3.out", immediateRender: false }, L(at));
          const screenOut = (s, at) => tl.to(s, { xPercent: -28, opacity: 0, duration: 0.36, ease: "power3.out" }, L(at));
          const tap = (pt, at) => {
            tl.fromTo("#r-finger", { opacity: 0, x: pt[0], y: pt[1], scale: 1.4 }, { opacity: 1, x: pt[0], y: pt[1], scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, L(at) - 0.12);
            tl.to("#r-finger", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(at));
            tl.to("#r-finger", { opacity: 0, duration: 0.14 }, L(at) + 0.18);
            tl.fromTo("#r-ring", { opacity: 0.95, x: pt[0], y: pt[1], scale: 0.4 }, { opacity: 0, x: pt[0], y: pt[1], scale: 1.6, duration: 0.42, ease: "power2.out", immediateRender: false }, L(at));
          };
          const capSwap = (out, inn, at) => {
            if (out) tl.to(out, { opacity: 0, y: -24, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, L(at) - 0.2);
            tl.fromTo(inn, { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out", immediateRender: false }, L(at));
          };

          // ---- section card: « Côté recruteurs », toggle clicked
          tl.fromTo("#r-ghost", { opacity: 0, xPercent: -50, scale: 0.9 }, { opacity: 1, xPercent: -50, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: true }, L(C.title6));
          tl.fromTo("#r-title", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out", immediateRender: true }, L(C.title6 + 0.04));
          tl.fromTo("#r-toggle", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2)", immediateRender: true }, L(C.title6 + 0.1));
          tl.fromTo("#r-cur", { opacity: 0, x: 220, y: 1500 }, { opacity: 1, x: 586, y: 1086, duration: 0.36, ease: "power3.out", immediateRender: true }, L(C.toggle6 - 0.38));
          tl.to("#r-cur", { scale: 0.85, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(C.toggle6));
          tl.fromTo("#r-toggle .kn", { x: 0 }, { x: 68, duration: 0.18, ease: "power3.out", immediateRender: true }, L(C.toggle6));
          tl.fromTo("#r-toggle .tr", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: true }, L(C.toggle6));
          tl.to(["#r-ghost", "#r-title", "#r-toggle"], { scale: 1.5, opacity: 0, filter: "blur(18px)", duration: 0.22, ease: "power3.in" }, L(C.toggle6 + 0.32));
          tl.to("#r-cur", { opacity: 0, duration: 0.12 }, L(C.toggle6 + 0.32));

          // ---- 1 · the company searches
          tl.fromTo("#r-ph", { opacity: 1, y: 760 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", immediateRender: false }, L(C.phone6));
          capSwap(null, "#r-cap1", C.phone6 + 0.08);
          tap(PT.loc, C.rennes);
          tl.to("#r-loc", { scale: 0.96, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(C.rennes));
          root.querySelectorAll(".r-res").forEach((c, i) => {
            tl.fromTo(c, { opacity: 0, y: 26, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(1.7)", immediateRender: false }, L(C.results + i * 0.1));
          });

          // ---- 2 · he finds the portail
          capSwap("#r-cap1", "#r-cap2", C.discover);
          tap(PT.card, C.tapCard);
          tl.to("#r-c0", { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(C.tapCard));
          screenOut("#r-s-search", C.profile6);
          screenIn("#r-s-pf", C.profile6);
          tl.fromTo("#r-cell0", { boxShadow: "0 0 0 0px rgba(227,110,45,0)" }, { boxShadow: "0 0 0 5px rgba(227,110,45,0.95)", duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, L(C.profile6 + 0.4));
          tap(PT.follow, C.follow);
          tl.to("#r-follow", { scale: 0.94, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(C.follow));

          // ---- 3 · and writes to Jules
          capSwap("#r-cap2", "#r-cap3", C.write);
          tap(PT.msg, C.write);
          tl.to("#r-msg", { scale: 0.94, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(C.write));
          screenOut("#r-s-pf", C.write + 0.06);
          screenIn("#r-s-chat", C.write + 0.06);
          tap(PT.send, C.send);
          tl.to("#r-send", { scale: 0.88, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(C.send));
          tl.to("#r-empty", { opacity: 0, duration: 0.12 }, L(C.send));
          tl.fromTo("#r-bub", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.24, ease: "back.out(1.8)", immediateRender: false }, L(C.send + 0.02));
          tl.fromTo("#r-sent", { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, L(C.send + 0.12));

          // ---- 4 · Jules' phone lights up: whip from one phone to the other
          tl.to("#r-ph", { x: -1250, filter: "blur(16px)", duration: 0.28, ease: "power3.in" }, L(C.send + 0.16));
          tl.fromTo("#r-ph2", { opacity: 1, x: 1250, filter: "blur(16px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out", immediateRender: false }, L(C.send + 0.2));
          tl.fromTo("#r-n1", { opacity: 0, y: -60, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(1.6)", immediateRender: false }, L(C.notif));
          tl.fromTo("#r-n2", { y: 0, scale: 1 }, { y: 82, scale: 0.97, duration: 0.3, ease: "power3.out", immediateRender: false }, L(C.notif));
          tl.to("#r-cap3", { opacity: 0, y: -24, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, L(C.notif - 0.1));
          tl.fromTo("#r-fin .w", { opacity: 0, y: 34, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out", stagger: 0.06, immediateRender: false }, L(C.notif + 0.1));

          // ---- exit
          tl.to("#r-ph2", { y: -1500, filter: "blur(16px)", duration: 0.32, ease: "power3.in" }, L(C.out6 + 0.04));
          tl.to("#r-fin", { opacity: 0, y: -40, filter: "blur(12px)", duration: 0.24, ease: "power2.in" }, L(C.out6));

          // time-driven text: typing, filter, results, follow state, screen visibility
          const qT = $("#r-q-t"), qC = $("#r-q-caret"), q = $("#r-q");
          const locT = $("#r-loc-t"), loc = $("#r-loc"), count = $("#r-count"), c0 = $("#r-c0");
          const fol = $("#r-follow"), folT = $("#r-follow-t"), followers = $("#r-followers");
          const inT = $("#r-in-t"), inC = $("#r-in-caret"), inp = $("#r-in");
          const Q = "Métallier", MSG = "Superbe portail ! On en parle ?";
          const typed = (t, a, b, s) => s.slice(0, Math.round(Math.max(0, Math.min(1, (t - a) / (b - a))) * s.length));
          const blink = (t) => Math.floor(t * 4) % 2 === 0;
          const SHOWN = [[-1, L(C.profile6) + 0.36], [L(C.profile6), L(C.write + 0.06) + 0.36], [L(C.write + 0.06), 99]];
          const render = () => {
            const t = tl.time();
            // each screen is shown only while it is on (or sliding across) the phone, from fixed cue times
            SCREENS.forEach((el, i) => {
              el.style.visibility = t >= SHOWN[i][0] && t < SHOWN[i][1] ? "visible" : "hidden";
            });
            // search field
            const a = L(C.type6a), b = L(C.type6b);
            if (t < a) {
              qT.textContent = "Métier, compétence…";
              q.classList.add("ph");
            } else {
              qT.textContent = typed(t, a, b, Q);
              q.classList.remove("ph");
            }
            const qFocus = t >= a - 0.15 && t < L(C.rennes) - 0.1;
            q.classList.toggle("focus", qFocus);
            qC.style.opacity = qFocus && (t < b || blink(t)) ? "1" : "0";
            const city = t >= L(C.rennes);
            locT.textContent = city ? "Rennes" : "Ville";
            loc.classList.toggle("on", city);
            count.textContent = t >= L(C.results) ? "4 profils · Métallier · Rennes" : t >= b ? "Recherche…" : "Lance une recherche";
            c0.classList.toggle("hl", t >= L(C.discover));
            // follow → abonné
            const on = t >= L(C.follow);
            fol.classList.toggle("on", on);
            folT.textContent = on ? "Abonné" : "Suivre";
            followers.textContent = on ? "19" : "18";
            // chat input
            const c = L(C.type6c), d = L(C.type6d);
            if (t < c || t >= L(C.send)) {
              inT.textContent = "Votre message…";
              inp.classList.add("ph");
            } else {
              inT.textContent = typed(t, c, d, MSG);
              inp.classList.remove("ph");
            }
            const iFocus = t >= c - 0.15 && t < L(C.send);
            inp.classList.toggle("focus", iFocus);
            inC.style.opacity = iFocus && (t < d || blink(t)) ? "1" : "0";
          };
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["recruteurs"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
