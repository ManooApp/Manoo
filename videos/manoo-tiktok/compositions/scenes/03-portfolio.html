      <script>
        (function () {
          const C = window.CUES;
          const T0 = 9.0;
          const L = (t) => +(t - T0).toFixed(3);
          const root = document.getElementById("p-root");
          const $ = (s) => root.querySelector(s);
          window.ManooIcons.hydrate(root);

          // phone geometry: 430 x 888 box centred at (540, 1040), scaled S; CAM_Y lifts it while the camera is open
          const S = 1.46, CAM_Y = -40;
          const screenEl = $("#p-screen");
          const stagePt = (el) => {
            const r = el.getBoundingClientRect(), sr = screenEl.getBoundingClientRect();
            const k = 394 / sr.width;
            const sx = (r.left + r.width / 2 - sr.left) * k, sy = (r.top + r.height / 2 - sr.top) * k;
            return [540 + (18 + sx - 215) * S, 1040 + (18 + sy - 444) * S];
          };
          // measure the taps before anything moves
          const shutPt = stagePt($("#p-shut")).map((v, i) => (i ? v + CAM_Y : v));
          const addPt = stagePt($("#p-btn-add"));
          // portfolio grid slots (2 columns)
          const slot = (i) => [(i % 2) * 188, Math.floor(i / 2) * 166];
          root.querySelectorAll(".p-old").forEach((c, i) => gsap.set(c, { x: slot(i)[0], y: slot(i)[1] }));
          gsap.set("#p-cell-new", { x: slot(0)[0], y: slot(0)[1], scale: 0, opacity: 0 });

          const SCREENS = ["#p-s-cam", "#p-s-pf", "#p-s-feed"].map((s) => $(s));
          gsap.set(["#p-s-pf", "#p-s-feed"], { xPercent: 100 });
          gsap.set("#p-sheet", { yPercent: 105 });
          gsap.set("#p-ph", { scale: S, opacity: 0, y: 760 });
          gsap.set(".p-cap", { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          const screenIn = (s, at) => tl.fromTo(s, { xPercent: 100, opacity: 1 }, { xPercent: 0, opacity: 1, duration: 0.38, ease: "power3.out", immediateRender: false }, L(at));
          const screenOut = (s, at) => tl.to(s, { xPercent: -28, opacity: 0, duration: 0.38, ease: "power3.out" }, L(at));
          const tap = (pt, at) => {
            tl.fromTo("#p-finger", { opacity: 0, x: pt[0], y: pt[1], scale: 1.4 }, { opacity: 1, x: pt[0], y: pt[1], scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, L(at) - 0.12);
            tl.to("#p-finger", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(at));
            tl.to("#p-finger", { opacity: 0, duration: 0.16 }, L(at) + 0.2);
            tl.fromTo("#p-ring", { opacity: 0.95, x: pt[0], y: pt[1], scale: 0.4 }, { opacity: 0, x: pt[0], y: pt[1], scale: 1.6, duration: 0.45, ease: "power2.out", immediateRender: false }, L(at));
          };
          const capSwap = (out, inn, at) => {
            if (out) tl.to(out, { opacity: 0, y: -24, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, L(at) - 0.2);
            tl.fromTo(inn, { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out", immediateRender: false }, L(at));
          };

          // ---- section card: « Ton portfolio », toggle clicked
          tl.fromTo("#p-ghost", { opacity: 0, xPercent: -50, scale: 0.9 }, { opacity: 1, xPercent: -50, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: true }, L(C.title3));
          tl.fromTo("#p-title", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out", immediateRender: true }, L(C.title3 + 0.04));
          tl.fromTo("#p-toggle", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2)", immediateRender: true }, L(C.title3 + 0.1));
          tl.fromTo("#p-cur", { opacity: 0, x: 860, y: 1500 }, { opacity: 1, x: 586, y: 1086, duration: 0.36, ease: "power3.out", immediateRender: true }, L(C.toggle3 - 0.38));
          tl.to("#p-cur", { scale: 0.85, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(C.toggle3));
          tl.fromTo("#p-toggle .kn", { x: 0 }, { x: 68, duration: 0.18, ease: "power3.out", immediateRender: true }, L(C.toggle3));
          tl.fromTo("#p-toggle .tr", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: true }, L(C.toggle3));
          tl.to(["#p-ghost", "#p-title", "#p-toggle"], { scale: 1.5, opacity: 0, filter: "blur(18px)", duration: 0.22, ease: "power3.in" }, L(C.toggle3 + 0.32));
          tl.to("#p-cur", { opacity: 0, duration: 0.12 }, L(C.toggle3 + 0.32));

          // ---- 1 · the photo
          tl.fromTo("#p-ph", { opacity: 1, y: 760 }, { opacity: 1, y: CAM_Y, duration: 0.42, ease: "power3.out", immediateRender: false }, L(C.phone3));
          tl.to("#p-ph", { y: 0, duration: 0.4, ease: "power3.inOut" }, L(C.sheet - 0.22));
          capSwap(null, "#p-cap1", C.phone3 + 0.08);
          tl.fromTo("#p-cam-img", { scale: 1.16, x: -12 }, { scale: 1.05, x: 10, duration: C.shutter - C.phone3, ease: "sine.inOut", immediateRender: true }, L(C.phone3));
          tl.fromTo("#p-focus", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, L(C.shutter - 0.48));
          tl.to("#p-focus", { opacity: 0, duration: 0.15 }, L(C.shutter - 0.05));
          tap(shutPt, C.shutter);
          tl.fromTo("#p-flash", { opacity: 0 }, { opacity: 1, duration: 0.04, immediateRender: false }, L(C.shutter));
          tl.to("#p-flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, L(C.shutter + 0.06));
          tl.fromTo("#p-thumb", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, L(C.shutter + 0.08));

          // ---- 2 · into the portfolio
          screenOut("#p-s-cam", C.sheet - 0.22);
          screenIn("#p-s-pf", C.sheet - 0.22);
          capSwap("#p-cap1", "#p-cap2", C.sheet);
          tl.fromTo("#p-dim", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, L(C.sheet));
          tl.fromTo("#p-sheet", { yPercent: 105 }, { yPercent: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, L(C.sheet));
          tap(addPt, C.addTap);
          tl.to("#p-btn-add", { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, L(C.addTap));
          tl.to("#p-sheet", { yPercent: 105, duration: 0.32, ease: "power3.in" }, L(C.toast3 - 0.06));
          tl.to("#p-dim", { opacity: 0, duration: 0.3 }, L(C.toast3 - 0.06));
          tl.fromTo("#p-toast", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, L(C.toast3));
          tl.to("#p-toast", { opacity: 0, y: -20, duration: 0.22 }, L(C.publish - 0.35));
          root.querySelectorAll(".p-old").forEach((c, i) => {
            tl.to(c, { x: slot(i + 1)[0], y: slot(i + 1)[1], duration: 0.34, ease: "power3.inOut" }, L(C.cellNew - 0.12 + i * 0.03));
          });
          tl.fromTo("#p-cell-new", { scale: 0, opacity: 0, x: slot(0)[0], y: slot(0)[1] }, { scale: 1, opacity: 1, x: slot(0)[0], y: slot(0)[1], duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, L(C.cellNew));
          tl.fromTo("#p-cell-new", { boxShadow: "0 0 0 0px rgba(227,110,45,0)" }, { boxShadow: "0 0 0 5px rgba(227,110,45,0.95)", duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, L(C.cellNew + 0.35));

          // ---- 3 · shared to the network
          screenOut("#p-s-pf", C.publish - 0.12);
          screenIn("#p-s-feed", C.publish - 0.12);
          capSwap("#p-cap2", "#p-cap3", C.publish);
          tl.fromTo("#p-post", { opacity: 0, y: -40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "back.out(1.5)", immediateRender: false }, L(C.post));
          tl.fromTo("#p-like", { color: "#807368" }, { color: "#e11d48", duration: 0.15, immediateRender: false }, L(C.likes));
          tl.fromTo("#p-like .ic", { scale: 1 }, { scale: 1.45, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, L(C.likes));
          tl.fromTo("#p-comment", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, L(C.comment));

          // ---- exit
          tl.to("#p-ph", { y: -1500, filter: "blur(16px)", duration: 0.34, ease: "power3.in" }, L(C.out3 + 0.04));
          tl.to("#p-cap3", { opacity: 0, y: -40, filter: "blur(12px)", duration: 0.24, ease: "power2.in" }, L(C.out3));

          // time-driven text: typed title, counters, screen visibility
          const ttl = $("#p-title-t"), caret = $("#p-caret"), input = $("#p-input");
          const TXT = "Portail en fer forgé";
          const likes = $("#p-likes"), coms = $("#p-coms"), npub = $("#p-npub"), mcount = $("#p-mcount");
          const render = () => {
            const t = tl.time();
            for (const el of SCREENS) {
              const op = parseFloat(gsap.getProperty(el, "opacity"));
              const xp = Math.abs(parseFloat(gsap.getProperty(el, "xPercent")) || 0);
              el.style.visibility = op > 0.001 && xp < 99.5 ? "visible" : "hidden";
            }
            const t0 = L(C.type3a), t1 = L(C.type3b);
            if (t < t0) {
              ttl.textContent = "Ex : Rénovation cuisine chêne massif";
              input.classList.add("ph");
            } else {
              const k = Math.min(1, (t - t0) / (t1 - t0));
              ttl.textContent = TXT.slice(0, Math.round(k * TXT.length));
              input.classList.remove("ph");
            }
            input.classList.toggle("focus", t >= t0 - 0.15 && t < L(C.addTap));
            caret.style.opacity = t >= t0 - 0.15 && t < L(C.addTap) && (t < t1 || Math.floor(t * 4) % 2 === 0) ? "1" : "0";
            const n = t >= L(C.cellNew) ? 5 : 4;
            npub.textContent = String(n);
            mcount.textContent = n + " / 5 médias";
            const k2 = Math.max(0, Math.min(1, (t - L(C.likes)) / 1.0));
            likes.textContent = String(Math.round(k2 * 27));
            coms.textContent = t >= L(C.comment) ? "1" : "0";
          };
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["portfolio"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
